<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taller de Ordenamiento — 12 métodos × 10 arreglos</title>
<style>
  :root{
    --bg: #0b1120;
    --surface: #111a2c;
    --surface-2: #0d1420;
    --border: #223047;
    --text: #e4e9f2;
    --muted: #8b98ab;
    --amber: #f5a524;
    --amber-dim: #b97a1a;
    --teal: #34d399;
    --red: #f0655f;
    --code-font: "JetBrains Mono", Consolas, "Courier New", monospace;
    --ui-font: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    font-family: var(--ui-font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Layout ---------- */
  .app{
    display:grid;
    grid-template-columns: 240px 1fr;
    min-height:100vh;
  }

  /* ---------- Sidebar ---------- */
  aside{
    background: var(--surface-2);
    border-right:1px solid var(--border);
    padding: 22px 14px;
    display:flex;
    flex-direction:column;
    gap: 18px;
  }

  .marca{
    padding: 0 6px 14px 6px;
    border-bottom:1px solid var(--border);
  }
  .marca .kicker{
    font-size:11px;
    letter-spacing:.04em;
    color: var(--muted);
    margin:0 0 4px 0;
  }
  .marca input{
    background:none;
    border:none;
    color: var(--text);
    font-size:17px;
    font-weight:600;
    width:100%;
    padding:2px 0;
    font-family: var(--ui-font);
  }
  .marca input:focus{ outline:none; border-bottom:1px solid var(--amber); }

  .tabs{
    display:flex;
    flex-direction:column;
    gap:4px;
    overflow-y:auto;
  }

  .tab{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px;
    border-radius:7px;
    cursor:pointer;
    color: var(--muted);
    border:1px solid transparent;
    font-size:14px;
  }
  .tab:hover{ background: rgba(255,255,255,0.03); color: var(--text); }
  .tab.activo{
    background: var(--surface);
    border-color: var(--border);
    color: var(--text);
  }
  .tab .num{
    font-family: var(--code-font);
    font-size:12px;
    color: var(--amber);
    min-width:20px;
  }
  .tab .titulo-tab{
    flex:1;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .tab .borrar-tab{
    opacity:0;
    color: var(--red);
    font-size:15px;
    padding:0 2px;
  }
  .tab:hover .borrar-tab{ opacity:.7; }
  .tab .borrar-tab:hover{ opacity:1; }

  .btn-agregar-punto{
    margin-top:4px;
    background:none;
    border:1px dashed var(--border);
    color: var(--muted);
    border-radius:7px;
    padding:9px 10px;
    cursor:pointer;
    font-size:14px;
    text-align:left;
  }
  .btn-agregar-punto:hover{ border-color: var(--amber-dim); color: var(--text); }

  .acciones-globales{
    margin-top:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding-top:14px;
    border-top:1px solid var(--border);
  }

  /* ---------- Buttons ---------- */
  button{
    font-family: var(--ui-font);
  }
  .btn{
    background: var(--surface);
    border:1px solid var(--border);
    color: var(--text);
    padding:8px 12px;
    border-radius:7px;
    font-size:13px;
    cursor:pointer;
  }
  .btn:hover{ border-color:#3a4b6a; }
  .btn-amber{
    background: var(--amber);
    border-color: var(--amber);
    color:#1a1204;
    font-weight:600;
  }
  .btn-amber:hover{ background:#ffb734; }
  .btn-mini{
    padding:4px 9px;
    font-size:12px;
    border-radius:6px;
  }

  /* ---------- Main ---------- */
  main{
    padding: 34px 44px 70px 44px;
    max-width: 980px;
  }

  .encabezado-punto{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin-bottom: 6px;
  }
  .encabezado-punto .num-grande{
    font-family: var(--code-font);
    color: var(--amber);
    font-size: 15px;
  }
  .encabezado-punto input.titulo{
    background:none;
    border:none;
    color: var(--text);
    font-size: 26px;
    font-weight:600;
    flex:1;
    padding: 2px 0;
    font-family: var(--ui-font);
  }
  .encabezado-punto input.titulo:focus{ outline:none; }

  textarea.descripcion{
    width:100%;
    background:none;
    border:none;
    color: var(--muted);
    font-family: var(--ui-font);
    font-size:14.5px;
    resize:none;
    padding:0;
    margin-bottom: 26px;
    line-height:1.5;
  }
  textarea.descripcion:focus{ outline:none; }

  section.bloque{
    background: var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding: 18px 20px 20px 20px;
    margin-bottom: 22px;
  }

  .bloque h3{
    margin:0 0 14px 0;
    font-size:14px;
    letter-spacing:.02em;
    color: var(--text);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .bloque h3 .sub{
    font-weight:400;
    color: var(--muted);
    font-size:12.5px;
  }

  .caja-codigo{
    position:relative;
    background: var(--surface-2);
    border-radius:8px;
    border:1px solid var(--border);
  }
  .caja-codigo textarea{
    width:100%;
    min-height: 260px;
    background:none;
    border:none;
    color:#dbe4f3;
    font-family: var(--code-font);
    font-size:13.5px;
    line-height:1.55;
    padding: 44px 16px 16px 16px;
    resize: vertical;
  }
  .caja-codigo textarea:focus{ outline:none; }
  .caja-codigo .barra{
    position:absolute;
    top:0; left:0; right:0;
    display:flex;
    justify-content:flex-end;
    padding:9px 10px;
  }

  .caja-salida{
    background: #0a1410;
    border:1px solid #16321f;
    border-radius:8px;
  }
  .caja-salida textarea{
    width:100%;
    min-height: 170px;
    background:none;
    border:none;
    color: var(--teal);
    font-family: var(--code-font);
    font-size:13.5px;
    line-height:1.5;
    padding: 16px;
    resize: vertical;
  }
  .caja-salida textarea:focus{ outline:none; }

  /* ---------- Tabla de estadísticas ---------- */
  table.stats{
    width:100%;
    border-collapse: collapse;
    font-size:13.5px;
  }
  table.stats th{
    text-align:left;
    color: var(--muted);
    font-weight:500;
    font-size:12px;
    padding: 6px 8px;
    border-bottom:1px solid var(--border);
  }
  table.stats td{
    padding: 3px 6px;
    border-bottom:1px solid var(--border);
  }
  table.stats tr:last-child td{ border-bottom:none; }
  table.stats input{
    width:100%;
    background:none;
    border:none;
    color: var(--text);
    font-family: var(--code-font);
    font-size:13px;
    padding:6px 4px;
    border-radius:4px;
  }
  table.stats input:focus{
    outline:none;
    background: rgba(245,165,36,0.08);
  }
  table.stats td.col-algoritmo input{ font-family: var(--ui-font); }
  table.stats td.col-borrar{ width:34px; text-align:center; }
  table.stats td.col-borrar button{
    background:none;
    border:none;
    color: var(--muted);
    cursor:pointer;
    font-size:15px;
  }
  table.stats td.col-borrar button:hover{ color: var(--red); }

  .pie-tabla{
    margin-top:10px;
  }

  textarea.notas{
    width:100%;
    min-height:80px;
    background: var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    color: var(--text);
    font-family: var(--ui-font);
    font-size:14px;
    padding:12px 14px;
    resize:vertical;
    line-height:1.5;
  }
  .toast{
    position:fixed;
    bottom:22px;
    right:22px;
    background: var(--amber);
    color:#1a1204;
    padding:9px 16px;
    border-radius:7px;
    font-size:13px;
    font-weight:600;
    opacity:0;
    transform: translateY(6px);
    transition: opacity .18s ease, transform .18s ease;
    pointer-events:none;
  }
  .toast.mostrar{ opacity:1; transform:translateY(0); }

  input[type="file"]{ display:none; }

  /* ---------- Print ---------- */
    /* ---------- Animaciones ---------- */
  .anim h1.titulo-anim{ margin:0; font-size:26px; font-weight:600; flex:1; }
  .desc-anim{ color: var(--muted); font-size:14.5px; line-height:1.5; margin:0 0 20px 0; }
  .anim-metodos{ display:grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap:8px; margin-bottom:18px; }
  .anim-m{ background: var(--surface); border:1px solid var(--border); color: var(--muted); border-radius:8px;
           padding:9px 10px; font-size:13.5px; cursor:pointer; text-align:left; }
  .anim-m span{ font-family: var(--code-font); color: var(--amber); font-size:12px; margin-right:4px; }
  .anim-m:hover{ color: var(--text); border-color:#3a4b6a; }
  .anim-m.activo{ background: var(--surface-2); color: var(--text); border-color: var(--amber); }
  .anim-info h2{ margin:0 0 8px 0; font-size:19px; }
  .anim-info p{ margin:10px 0 14px 0; color:#c4cddc; font-size:14px; line-height:1.55; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ background: var(--surface-2); border:1px solid var(--border); border-radius:20px; padding:3px 11px; font-size:12.5px; color: var(--muted); }
  .chip b{ color: var(--text); font-weight:600; }
  .chip-no b{ color: var(--red); }
  #animCanvas{ display:block; width:100%; background: var(--surface-2); border:1px solid var(--border); border-radius:8px; }
  .anim-leyenda{ display:flex; flex-wrap:wrap; gap:14px; margin:10px 2px 4px 2px; font-size:12px; color: var(--muted); }
  .anim-leyenda i{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
  .anim-msg{ min-height:44px; margin:8px 0 12px 0; padding:10px 12px; border-left:3px solid var(--amber);
             background: var(--surface-2); border-radius:0 6px 6px 0; font-size:14px; color: var(--text); }
  .anim-ctrl{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .anim-ctrl label{ display:flex; align-items:center; gap:6px; font-size:12.5px; color: var(--muted); }
  .anim-ctrl select{ background: var(--surface-2); color: var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 8px; }
  .anim-ctrl input[type=range]{ width:120px; accent-color: var(--amber); }
  .anim-cont{ display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin-top:14px; }
  .anim-cont div{ background: var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
  .anim-cont b{ display:block; font-family: var(--code-font); font-size:20px; color: var(--amber); }
  .anim-cont span{ font-size:12px; color: var(--muted); }

  @media print{
    aside, .barra button, .toast, .btn-agregar-punto, .col-borrar, .acciones-globales { display:none !important; }
    .app{ display:block; }
    main{ padding:0; max-width:none; }
    section.punto{ display:block !important; page-break-after: always; }
    section.bloque{ break-inside: avoid; border:1px solid #ccc; background:#fff; }
    body{ background:#fff; color:#111; }
    .caja-codigo, .caja-salida{ background:#f4f4f4 !important; border-color:#ccc !important; }
    .caja-codigo textarea{ color:#111 !important; }
    .caja-salida textarea{ color:#0a6b3d !important; }
    table.stats input{ color:#111; }
  }
</style>
</head>
<body>

<div class="app">

  <aside>
    <div class="marca">
      <p class="kicker">TALLER · ESTRUCTURAS DE DATOS</p>
      <input id="nombreProyecto" value="Parcial 1 — Ordenamiento" spellcheck="false">
    </div>

    <div class="tabs" id="listaTabs"></div>

    <button class="btn-agregar-punto" id="btnAgregarPunto">+ Agregar punto</button>

    <div class="acciones-globales">
      <button class="btn" id="btnExportar">Exportar proyecto (.json)</button>
      <button class="btn" id="btnImportar">Importar proyecto</button>
      <input type="file" id="inputImportar" accept="application/json">
      <button class="btn btn-amber" id="btnImprimir">Exportar a PDF / imprimir</button>
    </div>
  </aside>

  <main id="contenedorPuntos"></main>

</div>

<div class="toast" id="toast"></div>

DE ENTEROS\", boxear(NÚMEROS_DESORDENADOS));\n        probar(\"ORDENANDO ARRAY DE STRINGS\", NOMBRES_DESORDENADOS);\n    }\n\n    // =====================================================================\n    //  CONTADORES GLOBALES (se reinician antes de cada ejecución)\n    //  comparaciones : comparaciones entre elementos (compareTo)\n    //  intercambios  : swaps; en métodos que no intercambian (Inserción,\n    //                  Shell, Merge, Radix, Cubo, Counting) = movimientos\n    //                  (escrituras) de elementos en el arreglo\n    //  iteraciones   : pasadas de TODOS los ciclos (for/while) del método\n    // =====================================================================\n    static long comp, inter, iter;\n\n    static final String[] NOMBRES_METODOS = {\n        \"Burbuja Simple\", \"Burbuja Mejorado\", \"Quick Sort\", \"Shell Sort\",\n        \"Selección Directa\", \"Inserción Simple\", \"Shaker\", \"MergeSort\",\n        \"RadixSort\", \"Método de Montículo\", \"Método del Cubo\", \"Counting Sort\"\n    };\n    static final boolean[] RECURSIVO = {\n        false, false, true, false, false, false, false, true, false, false, false, false\n    };\n\n    static <T extends Comparable<T>> int cmp(T a, T b) {\n        comp++;\n        return a.compareTo(b);\n    }\n\n    static <T> void swap(T[] a, int i, int j) {\n        inter++;\n        T t = a[i];\n        a[i] = a[j];\n        a[j] = t;\n    }\n\n    // ---------------------------------------------------------------------\n    // 1. Burbuja simple: recorre todo el arreglo n-1 veces\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void burbuja(T[] a) {\n        int n = a.length;\n        for (int i = 0; i < n - 1; i++) {\n            iter++;\n            for (int j = 0; j < n - i - 1; j++) {\n                iter++;\n                if (cmp(a[j], a[j + 1]) > 0) swap(a, j, j + 1);\n            }\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 2. Burbuja mejorado: se detiene si una pasada no intercambió nada y\n    //    el límite de la siguiente pasada es el último intercambio hecho\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void burbujaMejorado(T[] a) {\n        int limite = a.length - 1;\n        boolean huboCambio = true;\n        while (huboCambio) {\n            iter++;\n            huboCambio = false;\n            int ultimo = 0;\n            for (int j = 0; j < limite; j++) {\n                iter++;\n                if (cmp(a[j], a[j + 1]) > 0) {\n                    swap(a, j, j + 1);\n                    huboCambio = true;\n                    ultimo = j;\n                }\n            }\n            limite = ultimo;\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 3. QuickSort (recursivo, partición de Hoare, pivote = elemento central)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void quickSort(T[] a) {\n        if (a.length > 1) quick(a, 0, a.length - 1);\n    }\n\n    static <T extends Comparable<T>> void quick(T[] a, int izq, int der) {\n        int i = izq, j = der;\n        T pivote = a[(izq + der) / 2];\n        while (i <= j) {\n            iter++;\n            while (cmp(a[i], pivote) < 0) { i++; iter++; }\n            while (cmp(a[j], pivote) > 0) { j--; iter++; }\n            if (i <= j) {\n                if (i < j) swap(a, i, j);\n                i++;\n                j--;\n            }\n        }\n        if (izq < j) quick(a, izq, j);\n        if (i < der) quick(a, i, der);\n    }\n\n    // ---------------------------------------------------------------------\n    // 4. Shell Sort (secuencia original de Shell: n/2, n/4, ..., 1)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void shellSort(T[] a) {\n        int n = a.length;\n        for (int salto = n / 2; salto > 0; salto /= 2) {\n            iter++;\n            for (int i = salto; i < n; i++) {\n                iter++;\n                T clave = a[i];\n                int j = i;\n                while (j >= salto && cmp(a[j - salto], clave) > 0) {\n                    iter++;\n                    a[j] = a[j - salto];\n                    inter++;\n                    j -= salto;\n                }\n                if (j != i) { a[j] = clave; inter++; }\n            }\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 5. Selección directa\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void seleccion(T[] a) {\n        int n = a.length;\n        for (int i = 0; i < n - 1; i++) {\n            iter++;\n            int menor = i;\n            for (int j = i + 1; j < n; j++) {\n                iter++;\n                if (cmp(a[j], a[menor]) < 0) menor = j;\n            }\n            if (menor != i) swap(a, i, menor);\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 6. Inserción simple\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void insercion(T[] a) {\n        for (int i = 1; i < a.length; i++) {\n            iter++;\n            T clave = a[i];\n            int j = i - 1;\n            while (j >= 0 && cmp(a[j], clave) > 0) {\n                iter++;\n                a[j + 1] = a[j];\n                inter++;\n                j--;\n            }\n            if (j + 1 != i) { a[j + 1] = clave; inter++; }\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 7. Shaker (burbuja bidireccional / cocktail sort)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void shaker(T[] a) {\n        int izq = 0, der = a.length - 1;\n        boolean huboCambio = true;\n        while (huboCambio && izq < der) {\n            iter++;\n            huboCambio = false;\n            for (int j = izq; j < der; j++) {          // ida: sube el mayor\n                iter++;\n                if (cmp(a[j], a[j + 1]) > 0) { swap(a, j, j + 1); huboCambio = true; }\n            }\n            der--;\n            for (int j = der; j > izq; j--) {          // vuelta: baja el menor\n                iter++;\n                if (cmp(a[j - 1], a[j]) > 0) { swap(a, j - 1, j); huboCambio = true; }\n            }\n            izq++;\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 8. MergeSort (recursivo, de arriba hacia abajo, arreglo auxiliar único)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void mergeSort(T[] a) {\n        T[] aux = Arrays.copyOf(a, a.length);\n        merge(a, aux, 0, a.length - 1);\n    }\n\n    static <T extends Comparable<T>> void merge(T[] a, T[] aux, int lo, int hi) {\n        if (lo >= hi) return;\n        int mid = (lo + hi) >>> 1;\n        merge(a, aux, lo, mid);\n        merge(a, aux, mid + 1, hi);\n        for (int k = lo; k <= hi; k++) { iter++; aux[k] = a[k]; }\n        int i = lo, j = mid + 1;\n        for (int k = lo; k <= hi; k++) {\n            iter++;\n            if (i > mid)                      a[k] = aux[j++];\n            else if (j > hi)                  a[k] = aux[i++];\n            else if (cmp(aux[j], aux[i]) < 0) a[k] = aux[j++];\n            else                              a[k] = aux[i++];\n            inter++;\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 9. RadixSort LSD (no compara elementos entre sí)\n    //    Enteros no negativos: base 10 | Strings: un carácter por pasada\n    // ---------------------------------------------------------------------\n    static void radixEnteros(Integer[] a) {\n        int n = a.length;\n        int max = 0;\n        for (int k = 0; k < n; k++) { iter++; if (a[k] > max) max = a[k]; }\n        Integer[] salida = new Integer[n];\n        for (int exp = 1; max / exp > 0; exp *= 10) {\n            iter++;\n            int[] cuenta = new int[10];\n            for (int k = 0; k < n; k++) { iter++; cuenta[(a[k] / exp) % 10]++; }\n            for (int d = 1; d < 10; d++) { iter++; cuenta[d] += cuenta[d - 1]; }\n            for (int k = n - 1; k >= 0; k--) {\n                iter++;\n                salida[--cuenta[(a[k] / exp) % 10]] = a[k];\n                inter++;\n            }\n            for (int k = 0; k < n; k++) { iter++; a[k] = salida[k]; inter++; }\n        }\n    }\n\n    static void radixStrings(String[] a) {\n        int n = a.length;\n        int largo = 0, maxChar = 0;\n        for (int k = 0; k < n; k++) {\n            iter++;\n            largo = Math.max(largo, a[k].length());\n            for (int c = 0; c < a[k].length(); c++) { iter++; maxChar = Math.max(maxChar, a[k].charAt(c)); }\n        }\n        int R = maxChar + 2;                       // 0 = \"sin carácter\" (más corta primero)\n        String[] salida = new String[n];\n        for (int pos = largo - 1; pos >= 0; pos--) {\n            iter++;\n            int[] cuenta = new int[R + 1];\n            for (int k = 0; k < n; k++) { iter++; cuenta[clave(a[k], pos) + 1]++; }\n            for (int r = 0; r < R; r++) { iter++; cuenta[r + 1] += cuenta[r]; }\n            for (int k = 0; k < n; k++) { iter++; salida[cuenta[clave(a[k], pos)]++] = a[k]; inter++; }\n            for (int k = 0; k < n; k++) { iter++; a[k] = salida[k]; inter++; }\n        }\n    }\n\n    static int clave(String s, int pos) {\n        return pos < s.length() ? s.charAt(pos) + 1 : 0;\n    }\n\n    // ---------------------------------------------------------------------\n    // 10. Método de Montículo (HeapSort, iterativo, montículo máximo)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void monticulo(T[] a) {\n        int n = a.length;\n        for (int i = n / 2 - 1; i >= 0; i--) { iter++; hundir(a, i, n); }\n        for (int fin = n - 1; fin > 0; fin--) {\n            iter++;\n            swap(a, 0, fin);\n            hundir(a, 0, fin);\n        }\n    }\n\n    static <T extends Comparable<T>> void hundir(T[] a, int i, int tam) {\n        while (2 * i + 1 < tam) {\n            iter++;\n            int hijo = 2 * i + 1;\n            if (hijo + 1 < tam && cmp(a[hijo + 1], a[hijo]) > 0) hijo++;\n            if (cmp(a[i], a[hijo]) >= 0) break;\n            swap(a, i, hijo);\n            i = hijo;\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 11. Método del Cubo (Bucket Sort): reparte en cubos y ordena cada cubo\n    //     con inserción. Enteros: por rango de valor | Strings: 1ª letra\n    // ---------------------------------------------------------------------\n    static void cuboEnteros(Integer[] a) {\n        int n = a.length;\n        int min = a[0], max = a[0];\n        for (int k = 1; k < n; k++) { iter++; if (a[k] < min) min = a[k]; if (a[k] > max) max = a[k]; }\n        int cubos = n;\n        long rango = (long) max - min + 1;\n        int[] idx = new int[n];\n        int[] inicio = new int[cubos + 1];\n        for (int k = 0; k < n; k++) {\n            iter++;\n            idx[k] = (int) ((a[k] - min) * (long) cubos / rango);\n            inicio[idx[k] + 1]++;\n        }\n        repartirYOrdenar(a, idx, inicio, cubos);\n    }\n\n    static void cuboStrings(String[] a) {\n        int n = a.length;\n        int min = Integer.MAX_VALUE, max = 0;\n        for (int k = 0; k < n; k++) {\n            iter++;\n            int c = a[k].isEmpty() ? 0 : a[k].charAt(0);\n            min = Math.min(min, c);\n            max = Math.max(max, c);\n        }\n        int cubos = max - min + 1;\n        int[] idx = new int[n];\n        int[] inicio = new int[cubos + 1];\n        for (int k = 0; k < n; k++) {\n            iter++;\n            idx[k] = (a[k].isEmpty() ? 0 : a[k].charAt(0)) - min;\n            inicio[idx[k] + 1]++;\n        }\n        repartirYOrdenar(a, idx, inicio, cubos);\n    }\n\n    static <T extends Comparable<T>> void repartirYOrdenar(T[] a, int[] idx, int[] inicio, int cubos) {\n        int n = a.length;\n        for (int b = 0; b < cubos; b++) { iter++; inicio[b + 1] += inicio[b]; }\n        T[] aux = Arrays.copyOf(a, n);\n        int[] sig = Arrays.copyOf(inicio, cubos);\n        for (int k = 0; k < n; k++) { iter++; aux[sig[idx[k]]++] = a[k]; inter++; }\n        for (int b = 0; b < cubos; b++) {          // inserción dentro de cada cubo\n            iter++;\n            for (int i = inicio[b] + 1; i < inicio[b + 1]; i++) {\n                iter++;\n                T clave = aux[i];\n                int j = i - 1;\n                while (j >= inicio[b] && cmp(aux[j], clave) > 0) {\n                    iter++;\n                    aux[j + 1] = aux[j];\n                    inter++;\n                    j--;\n                }\n                if (j + 1 != i) { aux[j + 1] = clave; inter++; }\n            }\n        }\n        for (int k = 0; k < n; k++) { iter++; a[k] = aux[k]; inter++; }\n    }\n\n    // ---------------------------------------------------------------------\n    // 12. Counting Sort (solo enteros: necesita claves enteras en un rango)\n    // ---------------------------------------------------------------------\n    static void countingSort(Integer[] a) {\n        int n = a.length;\n        int min = a[0], max = a[0];\n        for (int k = 1; k < n; k++) { iter++; if (a[k] < min) min = a[k]; if (a[k] > max) max = a[k]; }\n        int[] cuenta = new int[max - min + 1];\n        for (int k = 0; k < n; k++) { iter++; cuenta[a[k] - min]++; }\n        int pos = 0;\n        for (int v = 0; v < cuenta.length; v++) {\n            iter++;\n            while (cuenta[v]-- > 0) { iter++; a[pos++] = v + min; inter++; }\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // Despachador: ejecuta el método 'id' sobre el arreglo\n    // Retorna false si el método no aplica a ese tipo de dato\n    // ---------------------------------------------------------------------\n    @SuppressWarnings(\"unchecked\")\n    static <T extends Comparable<T>> boolean ejecutar(int id, T[] a) {\n        boolean esInt = a instanceof Integer[];\n        switch (id) {\n            case 0:  burbuja(a);          return true;\n            case 1:  burbujaMejorado(a);  return true;\n            case 2:  quickSort(a);        return true;\n            case 3:  shellSort(a);        return true;\n            case 4:  seleccion(a);        return true;\n            case 5:  insercion(a);        return true;\n            case 6:  shaker(a);           return true;\n            case 7:  mergeSort(a);        return true;\n            case 8:  if (esInt) radixEnteros((Integer[]) a); else radixStrings((String[]) a); return true;\n            case 9:  monticulo(a);        return true;\n            case 10: if (esInt) cuboEnteros((Integer[]) a); else cuboStrings((String[]) a); return true;\n            case 11: if (esInt) { countingSort((Integer[]) a); return true; } return false;\n            default: return false;\n        }\n    }\n\n    // =====================================================================\n    //  MEDICIÓN\n    //   - Tiempo   : mediana de 21 lotes de 20 ejecuciones (tras 1500 de calentamiento JIT)\n    //   - Memoria  : bytes asignados en el heap por el hilo durante el\n    //                ordenamiento (memoria auxiliar), mínimo de las ejecuciones\n    // =====================================================================\n    // Los resultados del taller se midieron con CALENTAMIENTO=1500, MEDICIONES=21 y\n    // LOTE=20 en una JVM local. Estos valores ligeros permiten ejecutarlo en un IDE\n    // online sin pasar el límite de tiempo (comparaciones, intercambios, iteraciones\n    // y memoria NO cambian; solo el tiempo se vuelve más ruidoso).\n    static final int CALENTAMIENTO = 60, MEDICIONES = 9, LOTE = 8;\n    static final Locale ES = Locale.forLanguageTag(\"es-CO\");\n    static final com.sun.management.ThreadMXBean TMX = obtenerTMX();\n\n    static com.sun.management.ThreadMXBean obtenerTMX() {\n        try {\n            java.lang.management.ThreadMXBean b = ManagementFactory.getThreadMXBean();\n            if (b instanceof com.sun.management.ThreadMXBean) return (com.sun.management.ThreadMXBean) b;\n        } catch (Throwable t) { }\n        return null;                                   // memoria no disponible en este entorno\n    }\n\n    static long bytesAsignados() {\n        return TMX != null ? TMX.getCurrentThreadAllocatedBytes() : 0;\n    }\n\n    @SuppressWarnings(\"unchecked\")\n    static <T extends Comparable<T>> void probar(String titulo, T[] original) {\n        System.out.println(\"=========================================================\");\n        System.out.println(titulo + \" (\" + original.length + \" elementos)\");\n        System.out.println(\"=========================================================\");\n        System.out.println(\"Muestra original: \" + muestra(original));\n        T[] referencia = original.clone();\n        Arrays.sort(referencia);                    // solo para VERIFICAR el resultado\n\n        for (int id = 0; id < NOMBRES_METODOS.length; id++) {\n            T[] prueba = original.clone();\n            if (!ejecutar(id, prueba)) {\n                System.out.printf(\"%-21s| No aplica a este tipo de dato%n\", NOMBRES_METODOS[id]);\n                continue;\n            }\n            boolean correcto = Arrays.equals(prueba, referencia);\n\n            for (int w = 0; w < CALENTAMIENTO; w++) ejecutar(id, original.clone());\n\n            long[] tiempos = new long[MEDICIONES];\n            long bytes = Long.MAX_VALUE, cComp = 0, cInter = 0, cIter = 0;\n            for (int r = 0; r < MEDICIONES; r++) {\n                // Lote de LOTE copias: se mide el tiempo total y se promedia\n                // (reduce el ruido del reloj en arreglos pequeños)\n                T[][] lote = (T[][]) new Comparable[LOTE][];\n                for (int c = 0; c < LOTE; c++) lote[c] = original.clone();\n                comp = 0; inter = 0; iter = 0;\n                long m0 = bytesAsignados();\n                long t0 = System.nanoTime();\n                ejecutar(id, lote[0]);\n                long t1 = System.nanoTime();\n                long m1 = bytesAsignados();\n                bytes = Math.min(bytes, m1 - m0);\n                cComp = comp; cInter = inter; cIter = iter;   // contadores de UNA sola ejecución\n                long t2 = System.nanoTime();\n                for (int c = 1; c < LOTE; c++) ejecutar(id, lote[c]);\n                long t3 = System.nanoTime();\n                tiempos[r] = (t1 - t0 + t3 - t2) / LOTE;\n            }\n            Arrays.sort(tiempos);\n            double ms = tiempos[MEDICIONES / 2] / 1_000_000.0;\n            System.out.println(String.format(ES,\n                \"%-21s| Comp: %-8d| Interc: %-8d| Iter: %-8d| Tiempo: %.3f ms | Memoria: %.2f KB | %s\",\n                NOMBRES_METODOS[id], cComp, cInter, cIter, ms, bytes / 1024.0,\n                correcto ? \"OK\" : \"ERROR\"));\n        }\n        System.out.println(\"Muestra ordenada: \" + muestra(referencia));\n        System.out.println();\n    }\n\n    static <T> String muestra(T[] a) {\n        StringBuilder sb = new StringBuilder(\"[\");\n        for (int i = 0; i < Math.min(8, a.length); i++) sb.append(i > 0 ? \", \" : \"\").append(a[i]);\n        return sb.append(a.length > 8 ? \", ...]\" : \"]\").toString();\n    }\n\n    static Integer[] boxear(int[] v) {\n        Integer[] r = new Integer[v.length];\n        for (int i = 0; i < v.length; i++) r[i] = v[i];\n        return r;\n    }\n\n}\n", "salida": "=========================================================\nORDENANDO ARRAY DE ENTEROS (500 elementos)\n=========================================================\nMuestra original: [2824, 1409, 5506, 5012, 4657, 3286, 2679, 9935, ...]\nBurbuja Simple       | Comp: 124750  | Interc: 58840   | Iter: 125249  | Tiempo: 0,462 ms | Memoria: 0,00 KB | OK\nBurbuja Mejorado     | Comp: 122078  | Interc: 58840   | Iter: 122537  | Tiempo: 0,489 ms | Memoria: 0,00 KB | OK\nQuick Sort           | Comp: 6015    | Interc: 1066    | Iter: 4687    | Tiempo: 0,013 ms | Memoria: 0,00 KB | OK\nShell Sort           | Comp: 6283    | Interc: 4790    | Iter: 6550    | Tiempo: 0,025 ms | Memoria: 0,00 KB | OK\nSelección Directa    | Comp: 124750  | Interc: 492     | Iter: 125249  | Tiempo: 0,491 ms | Memoria: 0,00 KB | OK\nInserción Simple     | Comp: 59334   | Interc: 59335   | Iter: 59339   | Tiempo: 0,153 ms | Memoria: 0,00 KB | OK\nShaker               | Comp: 91597   | Interc: 58840   | Iter: 91718   | Tiempo: 0,364 ms | Memoria: 0,00 KB | OK\nMergeSort            | Comp: 3870    | Interc: 4488    | Iter: 8976    | Tiempo: 0,033 ms | Memoria: 1,97 KB | OK\nRadixSort            | Comp: 0       | Interc: 4000    | Iter: 6540    | Tiempo: 0,014 ms | Memoria: 2,19 KB | OK\nMétodo de Montículo  | Comp: 7405    | Interc: 4030    | Iter: 4455    | Tiempo: 0,026 ms | Memoria: 0,00 KB | OK\nMétodo del Cubo      | Comp: 233     | Interc: 1238    | Iter: 3320    | Tiempo: 0,006 ms | Memoria: 7,88 KB | OK\nCounting Sort        | Comp: 0       | Interc: 500     | Iter: 10471   | Tiempo: 0,026 ms | Memoria: 42,88 KB | OK\nMuestra ordenada: [1006, 1009, 1027, 1035, 1053, 1058, 1090, 1106, ...]\n\n=========================================================\nORDENANDO ARRAY DE STRINGS (250 elementos)\n==================  Montículo\", \"Método del Cubo\", \"Counting Sort\"\n    };\n    static final boolean[] RECURSIVO = {\n        false, false, true, false, false, false, false, true, false, false, false, false\n    };\n\n    static <T extends Comparable<T>> int cmp(T a, T b) {\n        comp++;\n        return a.compareTo(b);\n    }\n\n    static <T> void swap(T[] a, int i, int j) {\n        inter++;\n        T t = a[i];\n        a[i] = a[j];\n        a[j] = t;\n    }\n\n    // ---------------------------------------------------------------------\n    // 1. Burbuja simple: recorre todo el arreglo n-1 veces\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void burbuja(T[] a) {\n        int n = a.length;\n        for (int i = 0; i < n - 1; i++) {\n            iter++;\n            for (int j = 0; j < n - i - 1; j++) {\n                iter++;\n                if (cmp(a[j], a[j + 1]) > 0) swap(a, j, j + 1);\n            }\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 2. Burbuja mejorado: se detiene si una pasada no intercambió nada y\n    //    el límite de la siguiente pasada es el último intercambio hecho\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void burbujaMejorado(T[] a) {\n        int limite = a.length - 1;\n        boolean huboCambio = true;\n        while (huboCambio) {\n            iter++;\n            huboCambio = false;\n            int ultimo = 0;\n            for (int j = 0; j < limite; j++) {\n                iter++;\n                if (cmp(a[j], a[j + 1]) > 0) {\n                    swap(a, j, j + 1);\n                    huboCambio = true;\n                    ultimo = j;\n                }\n            }\n            limite = ultimo;\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 3. QuickSort (recursivo, partición de Hoare, pivote = elemento central)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void quickSort(T[] a) {\n        if (a.length > 1) quick(a, 0, a.length - 1);\n    }\n\n    static <T extends Comparable<T>> void quick(T[] a, int izq, int der) {\n        int i = izq, j = der;\n        T pivote = a[(izq + der) / 2];\n        while (i <= j) {\n            iter++;\n            while (cmp(a[i], pivote) < 0) { i++; iter++; }\n            while (cmp(a[j], pivote) > 0) { j--; iter++; }\n            if (i <= j) {\n                if (i < j) swap(a, i, j);\n                i++;\n                j--;\n            }\n        }\n        if (izq < j) quick(a, izq, j);\n        if (i < der) quick(a, i, der);\n    }\n\n    // ---------------------------------------------------------------------\n    // 4. Shell Sort (secuencia original de Shell: n/2, n/4, ..., 1)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void shellSort(T[] a) {\n        int n = a.length;\n        for (int salto = n / 2; salto > 0; salto /= 2) {\n            iter++;\n            for (int i = salto; i < n; i++) {\n                iter++;\n                T clave = a[i];\n                int j = i;\n                while (j >= salto && cmp(a[j - salto], clave) > 0) {\n                    iter++;\n                    a[j] = a[j - salto];\n                    inter++;\n                    j -= salto;\n                }\n                if (j != i) { a[j] = clave; inter++; }\n            }\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 5. Selección directa\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void seleccion(T[] a) {\n        int n = a.length;\n        for (int i = 0; i < n - 1; i++) {\n            iter++;\n            int menor = i;\n            for (int j = i + 1; j < n; j++) {\n                iter++;\n                if (cmp(a[j], a[menor]) < 0) menor = j;\n            }\n            if (menor != i) swap(a, i, menor);\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 6. Inserción simple\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void insercion(T[] a) {\n        for (int i = 1; i < a.length; i++) {\n            iter++;\n            T clave = a[i];\n            int j = i - 1;\n            while (j >= 0 && cmp(a[j], clave) > 0) {\n                iter++;\n                a[j + 1] = a[j];\n                inter++;\n                j--;\n            }\n            if (j + 1 != i) { a[j + 1] = clave; inter++; }\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 7. Shaker (burbuja bidireccional / cocktail sort)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void shaker(T[] a) {\n        int izq = 0, der = a.length - 1;\n        boolean huboCambio = true;\n        while (huboCambio && izq < der) {\n            iter++;\n            huboCambio = false;\n            for (int j = izq; j < der; j++) {          // ida: sube el mayor\n                iter++;\n                if (cmp(a[j], a[j + 1]) > 0) { swap(a, j, j + 1); huboCambio = true; }\n            }\n            der--;\n            for (int j = der; j > izq; j--) {          // vuelta: baja el menor\n                iter++;\n                if (cmp(a[j - 1], a[j]) > 0) { swap(a, j - 1, j); huboCambio = true; }\n            }\n            izq++;\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 8. MergeSort (recursivo, de arriba hacia abajo, arreglo auxiliar único)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void mergeSort(T[] a) {\n        T[] aux = Arrays.copyOf(a, a.length);\n        merge(a, aux, 0, a.length - 1);\n    }\n\n    static <T extends Comparable<T>> void merge(T[] a, T[] aux, int lo, int hi) {\n        if (lo >= hi) return;\n        int mid = (lo + hi) >>> 1;\n        merge(a, aux, lo, mid);\n        merge(a, aux, mid + 1, hi);\n        for (int k = lo; k <= hi; k++) { iter++; aux[k] = a[k]; }\n        int i = lo, j = mid + 1;\n        for (int k = lo; k <= hi; k++) {\n            iter++;\n            if (i > mid)                      a[k] = aux[j++];\n            else if (j > hi)                  a[k] = aux[i++];\n            else if (cmp(aux[j], aux[i]) < 0) a[k] = aux[j++];\n            else                              a[k] = aux[i++];\n            inter++;\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 9. RadixSort LSD (no compara elementos entre sí)\n    //    Enteros no negativos: base 10 | Strings: un carácter por pasada\n    // ---------------------------------------------------------------------\n    static void radixEnteros(Integer[] a) {\n        int n = a.length;\n        int max = 0;\n        for (int k = 0; k < n; k++) { iter++; if (a[k] > max) max = a[k]; }\n        Integer[] salida = new Integer[n];\n        for (int exp = 1; max / exp > 0; exp *= 10) {\n            iter++;\n            int[] cuenta = new int[10];\n            for (int k = 0; k < n; k++) { iter++; cuenta[(a[k] / exp) % 10]++; }\n            for (int d = 1; d < 10; d++) { iter++; cuenta[d] += cuenta[d - 1]; }\n            for (int k = n - 1; k >= 0; k--) {\n                iter++;\n                salida[--cuenta[(a[k] / exp) % 10]] = a[k];\n                inter++;\n            }\n            for (int k = 0; k < n; k++) { iter++; a[k] = salida[k]; inter++; }\n        }\n    }\n\n    static void radixStrings(String[] a) {\n        int n = a.length;\n        int largo = 0, maxChar = 0;\n        for (int k = 0; k < n; k++) {\n            iter++;\n            largo = Math.max(largo, a[k].length());\n            for (int c = 0; c < a[k].length(); c++) { iter++; maxChar = Math.max(maxChar, a[k].charAt(c)); }\n        }\n        int R = maxChar + 2;                       // 0 = \"sin carácter\" (más corta primero)\n        String[] salida = new String[n];\n        for (int pos = largo - 1; pos >= 0; pos--) {\n            iter++;\n            int[] cuenta = new int[R + 1];\n            for (int k = 0; k < n; k++) { iter++; cuenta[clave(a[k], pos) + 1]++; }\n            for (int r = 0; r < R; r++) { iter++; cuenta[r + 1] += cuenta[r]; }\n            for (int k = 0; k < n; k++) { iter++; salida[cuenta[clave(a[k], pos)]++] = a[k]; inter++; }\n            for (int k = 0; k < n; k++) { iter++; a[k] = salida[k]; inter++; }\n        }\n    }\n\n    static int clave(String s, int pos) {\n        return pos < s.length() ? s.charAt(pos) + 1 : 0;\n    }\n\n    // ---------------------------------------------------------------------\n    // 10. Método de Montículo (HeapSort, iterativo, montículo máximo)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void monticulo(T[] a) {\n        int n = a.length;\n        for (int i = n / 2 - 1; i >= 0; i--) { iter++; hundir(a, i, n); }\n        for (int fin = n - 1; fin > 0; fin--) {\n            iter++;\n            swap(a, 0, fin);\n            hundir(a, 0, fin);\n        }\n    }\n\n    static <T extends Comparable<T>> void hundir(T[] a, int i, int tam) {\n        while (2 * i + 1 < tam) {\n            iter++;\n            int hijo = 2 * i + 1;\n            if (hijo + 1 < tam && cmp(a[hijo + 1], a[hijo]) > 0) hijo++;\n            if (cmp(a[i], a[hijo]) >= 0) break;\n            swap(a, i, hijo);\n            i = hijo;\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 11. Método del Cubo (Bucket Sort): reparte en cubos y ordena cada cubo\n    //     con inserción. Enteros: por rango de valor | Strings: 1ª letra\n    // ---------------------------------------------------------------------\n    static void cuboEnteros(Integer[] a) {\n        int n = a.length;\n        int min = a[0], max = a[0];\n        for (int k = 1; k < n; k++) { iter++; if (a[k] < min) min = a[k]; if (a[k] > max) max = a[k]; }\n        int cubos = n;\n        long rango = (long) max - min + 1;\n        int[] idx = new int[n];\n        int[] inicio = new int[cubos + 1];\n        for (int k = 0; k < n; k++) {\n            iter++;\n            idx[k] = (int) ((a[k] - min) * (long) cubos / rango);\n            inicio[idx[k] + 1]++;\n        }\n        repartirYOrdenar(a, idx, inicio, cubos);\n    }\n\n    static void cuboStrings(String[] a) {\n        int n = a.length;\n        int min = Integer.MAX_VALUE, max = 0;\n        for (int k = 0; k < n; k++) {\n            iter++;\n            int c = a[k].isEmpty() ? 0 : a[k].charAt(0);\n            min = Math.min(min, c);\n            max = Math.max(max, c);\n        }\n        int cubos = max - min + 1;\n        int[] idx = new int[n];\n        int[] inicio = new int[cubos + 1];\n        for (int k = 0; k < n; k++) {\n            iter++;\n            idx[k] = (a[k].isEmpty() ? 0 : a[k].charAt(0)) - min;\n            inicio[idx[k] + 1]++;\n        }\n        repartirYOrdenar(a, idx, inicio, cubos);\n    }\n\n    static <T extends Comparable<T>> void repartirYOrdenar(T[] a, int[] idx, int[] inicio, int cubos) {\n        int n = a.length;\n        for (int b = 0; b < cubos; b++) { iter++; inicio[b + 1] += inicio[b]; }\n        T[] aux = Arrays.copyOf(a, n);\n        int[] sig = Arrays.copyOf(inicio, cubos);\n        for (int k = 0; k < n; k++) { iter++; aux[sig[idx[k]]++] = a[k]; inter++; }\n        for (int b = 0; b < cubos; b++) {          // inserción dentro de cada cubo\n            iter++;\n            for (int i = inicio[b] + 1; i < inicio[b + 1]; i++) {\n                iter++;\n                T clave = aux[i];\n                int j = i - 1;\n                while (j >= inicio[b] && cmp(aux[j], clave) > 0) {\n                    iter++;\n                    aux[j + 1] = aux[j];\n                    inter++;\n                    j--;\n                }\n                if (j + 1 != i) { aux[j + 1] = clave; inter++; }\n            }\n        }\n        for (int k = 0; k < n; k++) { iter++; a[k] = aux[k]; inter++; }\n    }\n\n    // ---------------------------------------------------------------------\n    // 12. Counting Sort (solo enteros: necesita claves enteras en un rango)\n    // ---------------------------------------------------------------------\n    static void countingSort(Integer[] a) {\n        int n = a.length;\n        int min = a[0], max = a[0];\n        for (int k = 1; k < n; k++) { iter++; if (a[k] < min) min = a[k]; if (a[k] > max) max = a[k]; }\n        int[] cuenta = new int[max - min + 1];\n        for (int k = 0; k < n; k++) { iter++; cuenta[a[k] - min]++; }\n        int pos = 0;\n        for (int v = 0; v < cuenta.length; v++) {\n            iter++;\n            while (cuenta[v]-- > 0) { iter++; a[pos++] = v + min; inter++; }\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // Despachador: ejecuta el método 'id' sobre el arreglo\n    // Retorna false si el método no aplica a ese tipo de dato\n    // ---------------------------------------------------------------------\n    @SuppressWarnings(\"unchecked\")\n    static <T extends Comparable<T>> boolean ejecutar(int id, T[] a) {\n        boolean esInt = a instanceof Integer[];\n        switch (id) {\n            case 0:  burbuja(a);          return true;\n            case 1:  burbujaMejorado(a);  return true;\n            case 2:  quickSort(a);        return true;\n            case 3:  shellSort(a);        return true;\n            case 4:  seleccion(a);        return true;\n            case 5:  insercion(a);        return true;\n            case 6:  shaker(a);           return true;\n            case 7:  mergeSort(a);        return true;\n            case 8:  if (esInt) radixEnteros((Integer[]) a); else radixStrings((String[]) a); return true;\n            case 9:  monticulo(a);        return true;\n            case 10: if (esInt) cuboEnteros((Integer[]) a); else cuboStrings((String[]) a); return true;\n            case 11: if (esInt) { countingSort((Integer[]) a); return true; } return false;\n            default: return false;\n        }\n    }\n\n    // =====================================================================\n    //  MEDICIÓN\n    //   - Tiempo   : mediana de 21 lotes de 20 ejecuciones (tras 1500 de calentamiento JIT)\n    //   - Memoria  : bytes asignados en el heap por el hilo durante el\n    //                ordenamiento (memoria auxiliar), mínimo de las ejecuciones\n    // =====================================================================\n    // Los resultados del taller se midieron con CALENTAMIENTO=1500, MEDICIONES=21 y\n    // LOTE=20 en una JVM local. Estos valores ligeros permiten ejecutarlo en un IDE\n    // online sin pasar el límite de tiempo (comparaciones, intercambios, iteraciones\n    // y memoria NO cambian; solo el tiempo se vuelve más ruidoso).\n    static final int CALENTAMIENTO = 60, MEDICIONES = 9, LOTE = 8;\n    static final Locale ES = Locale.forLanguageTag(\"es-CO\");\n    static final com.sun.management.ThreadMXBean TMX = obtenerTMX();\n\n    static com.sun.management.ThreadMXBean obtenerTMX() {\n        try {\n            java.lang.management.ThreadMXBean b = ManagementFactory.getThreadMXBean();\n            if (b instanceof com.sun.management.ThreadMXBean) return (com.sun.management.ThreadMXBean) b;\n        } catch (Throwable t) { }\n        return null;                                   // memoria no disponible en este entorno\n    }\n\n    static long bytesAsignados() {\n        return TMX != null ? TMX.getCurrentThreadAllocatedBytes() : 0;\n    }\n\n    @SuppressWarnings(\"unchecked\")\n    static <T extends Comparable<T>> void probar(String titulo, T[] original) {\n        System.out.println(\"=========================================================\");\n        System.out.println(titulo + \" (\" + original.length + \" elementos)\");\n        System.out.println(\"=========================================================\");\n        System.out.println(\"Muestra original: \" + muestra(original));\n        T[] referencia = original.clone();\n        Arrays.sort(referencia);                    // solo para VERIFICAR el resultado\n\n        for (int id = 0; id < NOMBRES_METODOS.length; id++) {\n            T[] prueba = original.clone();\n            if (!ejecutar(id, prueba)) {\n                System.out.printf(\"%-21s| No aplica a este tipo de dato%n\", NOMBRES_METODOS[id]);\n                continue;\n            }\n            boolean correcto = Arrays.equals(prueba, referencia);\n\n            for (int w = 0; w < CALENTAMIENTO; w++) ejecutar(id, original.clone());\n\n            long[] tiempos = new long[MEDICIONES];\n            long bytes = Long.MAX_VALUE, cComp = 0, cInter = 0, cIter = 0;\n            for (int r = 0; r < MEDICIONES; r++) {\n                // Lote de LOTE copias: se mide el tiempo total y se promedia\n                // (reduce el ruido del reloj en arreglos pequeños)\n                T[][] lote = (T[][]) new Comparable[LOTE][];\n                for (int c = 0; c < LOTE; c++) lote[c] = original.clone();\n                comp = 0; inter = 0; iter = 0;\n                long m0 = bytesAsignados();\n                long t0 = System.nanoTime();\n                ejecutar(id, lote[0]);\n                long t1 = System.nanoTime();\n                long m1 = bytesAsignados();\n                bytes = Math.min(bytes, m1 - m0);\n                cComp = comp; cInter = inter; cIter = iter;   // contadores de UNA sola ejecución\n                long t2 = System.nanoTime();\n                for (int c = 1; c < LOTE; c++) ejecutar(id, lote[c]);\n                long t3 = System.nanoTime();\n                tiempos[r] = (t1 - t0 + t3 - t2) / LOTE;\n            }\n            Arrays.sort(tiempos);\n            double ms = tiempos[MEDICIONES / 2] / 1_000_000.0;\n            System.out.println(String.format(ES,\n                \"%-21s| Comp: %-8d| Interc: %-8d| Iter: %-8d| Tiempo: %.3f ms | Memoria: %.2f KB | %s\",\n                NOMBRES_METODOS[id], cComp, cInter, cIter, ms, bytes / 1024.0,\n                correcto ? \"OK\" : \"ERROR\"));\n        }\n        System.out.println(\"Muestra ordenada: \" + muestra(referencia));\n        System.out.println();\n    }\n\n    static <T> String muestra(T[] a) {\n        StringBuilder sb = new StringBuilder(\"[\");\n        for (int i = 0; i < Math.min(8, a.length); i++) sb.append(i > 0 ? \", \" : \"\").append(a[i]);\n        return sb.append(a.length > 8 ? \", ...]\" : \"]\").toString();\n    }\n\n    static Integer[] boxear(int[] v) {\n        Integer[] r = new Integer[v.length];\n        for (int i = 0; i < v.length; i++) r[i] = v[i];\n        return r;\n    }\n\n}\n", "salida": "=========================================================\nORDENANDO ARRAY DE ENTEROS (500 elementos)\n=========================================================\nMuestra original: [1409, 2424, 2679, 2824, 3286, 4657, 5012, 5506, ...]\nBurbuja Simple       | Comp: 124750  | Interc: 56851   | Iter: 125249  | Tiempo: 0,440 ms | Memoria: 0,00 KB | OK\nBurbuja Mejorado     | Comp: 123706  | Interc: 56851   | Iter: 124183  | Tiempo: 0,503 ms | Memoria: 0,00 KB | OK\nQuick Sort           | Comp: 6967    | Interc: 998     | Iter: 5697    | Tiempo: 0,015 ms | Memoria: 0,00 KB | OK\nShell Sort           | Comp: 7152    | Interc: 5740    | Iter: 7405    | Tiempo: 0,026 ms | Memoria: 0,00 KB | OK\nSelección Directa    | Comp: 124750  | Interc: 491     | Iter: 125249  | Tiempo: 0,487 ms | Memoria: 0,00 KB \n    //  comparaciones : comparaciones entre elementos (compareTo)\n    //  intercambios  : swaps; en métodos que no intercambian (Inserción,\n    //                  Shell, Merge, Radix, Cubo, Counting) = movimientos\n    //                  (escrituras) de elementos en el arreglo\n    //  iteraciones   : pasadas de TODOS los ciclos (for/while) del método\n    // =====================================================================\n    static long comp, inter, iter;\n\n    static final String[] NOMBRES_METODOS = {\n        \"Burbuja Simple\", \"Burbuja Mejorado\", \"Quick Sort\", \"Shell Sort\",\n        \"Selección Directa\", \"Inserción Simple\", \"Shaker\", \"MergeSort\",\n        \"RadixSort\", \"Método de Montículo\", \"Método del Cubo\", \"Counting Sort\"\n    };\n    static final boolean[] RECURSIVO = {\n        false, false, true, false, false, false, false, true, false, false, false, false\n    };\n\n    static <T extends Comparable<T>> int cmp(T a, T b) {\n        comp++;\n        return a.compareTo(b);\n    }\n\n    static <T> void swap(T[] a, int i, int j) {\n        inter++;\n        T t = a[i];\n        a[i] = a[j];\n        a[j] = t;\n    }\n\n    // ---------------------------------------------------------------------\n    // 1. Burbuja simple: recorre todo el arreglo n-1 veces\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void burbuja(T[] a) {\n        int n = a.length;\n        for (int i = 0; i < n - 1; i++) {\n            iter++;\n            for (int j = 0; j < n - i - 1; j++) {\n                iter++;\n                if (cmp(a[j], a[j + 1]) > 0) swap(a, j, j + 1);\n            }\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 2. Burbuja mejorado: se detiene si una pasada no intercambió nada y\n    //    el límite de la siguiente pasada es el último intercambio hecho\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void burbujaMejorado(T[] a) {\n        int limite = a.length - 1;\n        boolean huboCambio = true;\n        while (huboCambio) {\n            iter++;\n            huboCambio = false;\n            int ultimo = 0;\n            for (int j = 0; j < limite; j++) {\n                iter++;\n                if (cmp(a[j], a[j + 1]) > 0) {\n                    swap(a, j, j + 1);\n                    huboCambio = true;\n                    ultimo = j;\n                }\n            }\n            limite = ultimo;\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 3. QuickSort (recursivo, partición de Hoare, pivote = elemento central)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void quickSort(T[] a) {\n        if (a.length > 1) quick(a, 0, a.length - 1);\n    }\n\n    static <T extends Comparable<T>> void quick(T[] a, int izq, int der) {\n        int i = izq, j = der;\n        T pivote = a[(izq + der) / 2];\n        while (i <= j) {\n            iter++;\n            while (cmp(a[i], pivote) < 0) { i++; iter++; }\n            while (cmp(a[j], pivote) > 0) { j--; iter++; }\n            if (i <= j) {\n                if (i < j) swap(a, i, j);\n                i++;\n                j--;\n            }\n        }\n        if (izq < j) quick(a, izq, j);\n        if (i < der) quick(a, i, der);\n    }\n\n    // ---------------------------------------------------------------------\n    // 4. Shell Sort (secuencia original de Shell: n/2, n/4, ..., 1)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void shellSort(T[] a) {\n        int n = a.length;\n        for (int salto = n / 2; salto > 0; salto /= 2) {\n            iter++;\n            for (int i = salto; i < n; i++) {\n                iter++;\n                T clave = a[i];\n                int j = i;\n                while (j >= salto && cmp(a[j - salto], clave) > 0) {\n                    iter++;\n                    a[j] = a[j - salto];\n                    inter++;\n                    j -= salto;\n                }\n                if (j != i) { a[j] = clave; inter++; }\n            }\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 5. Selección directa\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void seleccion(T[] a) {\n        int n = a.length;\n        for (int i = 0; i < n - 1; i++) {\n            iter++;\n            int menor = i;\n            for (int j = i + 1; j < n; j++) {\n                iter++;\n                if (cmp(a[j], a[menor]) < 0) menor = j;\n            }\n            if (menor != i) swap(a, i, menor);\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 6. Inserción simple\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void insercion(T[] a) {\n        for (int i = 1; i < a.length; i++) {\n            iter++;\n            T clave = a[i];\n            int j = i - 1;\n            while (j >= 0 && cmp(a[j], clave) > 0) {\n                iter++;\n                a[j + 1] = a[j];\n                inter++;\n                j--;\n            }\n            if (j + 1 != i) { a[j + 1] = clave; inter++; }\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 7. Shaker (burbuja bidireccional / cocktail sort)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void shaker(T[] a) {\n        int izq = 0, der = a.length - 1;\n        boolean huboCambio = true;\n        while (huboCambio && izq < der) {\n            iter++;\n            huboCambio = false;\n            for (int j = izq; j < der; j++) {          // ida: sube el mayor\n                iter++;\n                if (cmp(a[j], a[j + 1]) > 0) { swap(a, j, j + 1); huboCambio = true; }\n            }\n            der--;\n            for (int j = der; j > izq; j--) {          // vuelta: baja el menor\n                iter++;\n                if (cmp(a[j - 1], a[j]) > 0) { swap(a, j - 1, j); huboCambio = true; }\n            }\n            izq++;\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 8. MergeSort (recursivo, de arriba hacia abajo, arreglo auxiliar único)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void mergeSort(T[] a) {\n        T[] aux = Arrays.copyOf(a, a.length);\n        merge(a, aux, 0, a.length - 1);\n    }\n\n    static <T extends Comparable<T>> void merge(T[] a, T[] aux, int lo, int hi) {\n        if (lo >= hi) return;\n        int mid = (lo + hi) >>> 1;\n        merge(a, aux, lo, mid);\n        merge(a, aux, mid + 1, hi);\n        for (int k = lo; k <= hi; k++) { iter++; aux[k] = a[k]; }\n        int i = lo, j = mid + 1;\n        for (int k = lo; k <= hi; k++) {\n            iter++;\n            if (i > mid)                      a[k] = aux[j++];\n            else if (j > hi)                  a[k] = aux[i++];\n            else if (cmp(aux[j], aux[i]) < 0) a[k] = aux[j++];\n            else                              a[k] = aux[i++];\n            inter++;\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 9. RadixSort LSD (no compara elementos entre sí)\n    //    Enteros no negativos: base 10 | Strings: un carácter por pasada\n    // ---------------------------------------------------------------------\n    static void radixEnteros(Integer[] a) {\n        int n = a.length;\n        int max = 0;\n        for (int k = 0; k < n; k++) { iter++; if (a[k] > max) max = a[k]; }\n        Integer[] salida = new Integer[n];\n        for (int exp = 1; max / exp > 0; exp *= 10) {\n            iter++;\n            int[] cuenta = new int[10];\n            for (int k = 0; k < n; k++) { iter++; cuenta[(a[k] / exp) % 10]++; }\n            for (int d = 1; d < 10; d++) { iter++; cuenta[d] += cuenta[d - 1]; }\n            for (int k = n - 1; k >= 0; k--) {\n                iter++;\n                salida[--cuenta[(a[k] / exp) % 10]] = a[k];\n                inter++;\n            }\n            for (int k = 0; k < n; k++) { iter++; a[k] = salida[k]; inter++; }\n        }\n    }\n\n    static void radixStrings(String[] a) {\n        int n = a.length;\n        int largo = 0, maxChar = 0;\n        for (int k = 0; k < n; k++) {\n            iter++;\n            largo = Math.max(largo, a[k].length());\n            for (int c = 0; c < a[k].length(); c++) { iter++; maxChar = Math.max(maxChar, a[k].charAt(c)); }\n        }\n        int R = maxChar + 2;                       // 0 = \"sin carácter\" (más corta primero)\n        String[] salida = new String[n];\n        for (int pos = largo - 1; pos >= 0; pos--) {\n            iter++;\n            int[] cuenta = new int[R + 1];\n            for (int k = 0; k < n; k++) { iter++; cuenta[clave(a[k], pos) + 1]++; }\n            for (int r = 0; r < R; r++) { iter++; cuenta[r + 1] += cuenta[r]; }\n            for (int k = 0; k < n; k++) { iter++; salida[cuenta[clave(a[k], pos)]++] = a[k]; inter++; }\n            for (int k = 0; k < n; k++) { iter++; a[k] = salida[k]; inter++; }\n        }\n    }\n\n    static int clave(String s, int pos) {\n        return pos < s.length() ? s.charAt(pos) + 1 : 0;\n    }\n\n    // ---------------------------------------------------------------------\n    // 10. Método de Montículo (HeapSort, iterativo, montículo máximo)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void monticulo(T[] a) {\n        int n = a.length;\n        for (int i = n / 2 - 1; i >= 0; i--) { iter++; hundir(a, i, n); }\n        for (int fin = n - 1; fin > 0; fin--) {\n            iter++;\n            swap(a, 0, fin);\n            hundir(a, 0, fin);\n        }\n    }\n\n    static <T extends Comparable<T>> void hundir(T[] a, int i, int tam) {\n        while (2 * i + 1 < tam) {\n            iter++;\n            int hijo = 2 * i + 1;\n            if (hijo + 1 < tam && cmp(a[hijo + 1], a[hijo]) > 0) hijo++;\n            if (cmp(a[i], a[hijo]) >= 0) break;\n            swap(a, i, hijo);\n            i = hijo;\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 11. Método del Cubo (Bucket Sort): reparte en cubos y ordena cada cubo\n    //     con inserción. Enteros: por rango de valor | Strings: 1ª letra\n    // ---------------------------------------------------------------------\n    static void cuboEnteros(Integer[] a) {\n        int n = a.length;\n        int min = a[0], max = a[0];\n        for (int k = 1; k < n; k++) { iter++; if (a[k] < min) min = a[k]; if (a[k] > max) max = a[k]; }\n        int cubos = n;\n        long rango = (long) max - min + 1;\n        int[] idx = new int[n];\n        int[] inicio = new int[cubos + 1];\n        for (int k = 0; k < n; k++) {\n            iter++;\n            idx[k] = (int) ((a[k] - min) * (long) cubos / rango);\n            inicio[idx[k] + 1]++;\n        }\n        repartirYOrdenar(a, idx, inicio, cubos);\n    }\n\n    static void cuboStrings(String[] a) {\n        int n = a.length;\n        int min = Integer.MAX_VALUE, max = 0;\n        for (int k = 0; k < n; k++) {\n            iter++;\n            int c = a[k].isEmpty() ? 0 : a[k].charAt(0);\n            min = Math.min(min, c);\n            max = Math.max(max, c);\n        }\n        int cubos = max - min + 1;\n        int[] idx = new int[n];\n        int[] inicio = new int[cubos + 1];\n        for (int k = 0; k < n; k++) {\n            iter++;\n            idx[k] = (a[k].isEmpty() ? 0 : a[k].charAt(0)) - min;\n            inicio[idx[k] + 1]++;\n        }\n        repartirYOrdenar(a, idx, inicio, cubos);\n    }\n\n    static <T extends Comparable<T>> void repartirYOrdenar(T[] a, int[] idx, int[] inicio, int cubos) {\n        int n = a.length;\n        for (int b = 0; b < cubos; b++) { iter++; inicio[b + 1] += inicio[b]; }\n        T[] aux = Arrays.copyOf(a, n);\n        int[] sig = Arrays.copyOf(inicio, cubos);\n        for (int k = 0; k < n; k++) { iter++; aux[sig[idx[k]]++] = a[k]; inter++; }\n        for (int b = 0; b < cubos; b++) {          // inserción dentro de cada cubo\n            iter++;\n            for (int i = inicio[b] + 1; i < inicio[b + 1]; i++) {\n                iter++;\n                T clave = aux[i];\n                int j = i - 1;\n                while (j >= inicio[b] && cmp(aux[j], clave) > 0) {\n                    iter++;\n                    aux[j + 1] = aux[j];\n                    inter++;\n                    j--;\n                }\n                if (j + 1 != i) { aux[j + 1] = clave; inter++; }\n            }\n        }\n        for (int k = 0; k < n; k++) { iter++; a[k] = aux[k]; inter++; }\n    }\n\n    // ---------------------------------------------------------------------\n    // 12. Counting Sort (solo enteros: necesita claves enteras en un rango)\n    // ---------------------------------------------------------------------\n    static void countingSort(Integer[] a) {\n        int n = a.length;\n        int min = a[0], max = a[0];\n        for (int k = 1; k < n; k++) { iter++; if (a[k] < min) min = a[k]; if (a[k] > max) max = a[k]; }\n        int[] cuenta = new int[max - min + 1];\n        for (int k = 0; k < n; k++) { iter++; cuenta[a[k] - min]++; }\n        int pos = 0;\n        for (int v = 0; v < cuenta.length; v++) {\n            iter++;\n            while (cuenta[v]-- > 0) { iter++; a[pos++] = v + min; inter++; }\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // Despachador: ejecuta el método 'id' sobre el arreglo\n    // Retorna false si el método no aplica a ese tipo de dato\n    // ---------------------------------------------------------------------\n    @SuppressWarnings(\"unchecked\")\n    static <T extends Comparable<T>> boolean ejecutar(int id, T[] a) {\n        boolean esInt = a instanceof Integer[];\n        switch (id) {\n            case 0:  burbuja(a);          return true;\n            case 1:  burbujaMejorado(a);  return true;\n            case 2:  quickSort(a);        return true;\n            case 3:  shellSort(a);        return true;\n            case 4:  seleccion(a);        return true;\n            case 5:  insercion(a);        return true;\n            case 6:  shaker(a);           return true;\n            case 7:  mergeSort(a);        return true;\n            case 8:  if (esInt) radixEnteros((Integer[]) a); else radixStrings((String[]) a); return true;\n            case 9:  monticulo(a);        return true;\n            case 10: if (esInt) cuboEnteros((Integer[]) a); else cuboStrings((String[]) a); return true;\n            case 11: if (esInt) { countingSort((Integer[]) a); return true; } return false;\n            default: return false;\n        }\n    }\n\n    // =====================================================================\n    //  MEDICIÓN\n    //   - Tiempo   : mediana de 21 lotes de 20 ejecuciones (tras 1500 de calentamiento JIT)\n    //   - Memoria  : bytes asignados en el heap por el hilo durante el\n    //                ordenamiento (memoria auxiliar), mínimo de las ejecuciones\n    // =====================================================================\n    // Los resultados del taller se midieron con CALENTAMIENTO=1500, MEDICIONES=21 y\n    // LOTE=20 en una JVM local. Estos valores ligeros permiten ejecutarlo en un IDE\n    // online sin pasar el límite de tiempo (comparaciones, intercambios, iteraciones\n    // y memoria NO cambian; solo el tiempo se vuelve más ruidoso).\n    static final int CALENTAMIENTO = 60, MEDICIONES = 9, LOTE = 8;\n    static final Locale ES = Locale.forLanguageTag(\"es-CO\");\n    static final com.sun.management.ThreadMXBean TMX = obtenerTMX();\n\n    static com.sun.management.ThreadMXBean obtenerTMX() {\n        try {\n            java.lang.management.ThreadMXBean b = ManagementFactory.getThreadMXBean();\n            if (b instanceof com.sun.management.ThreadMXBean) return (com.sun.management.ThreadMXBean) b;\n        } catch (Throwable t) { }\n        return null;                                   // memoria no disponible en este entorno\n    }\n\n    static long bytesAsignados() {\n        return TMX != null ? TMX.getCurrentThreadAllocatedBytes() : 0;\n    }\n\n    @SuppressWarnings(\"unchecked\")\n    static <T extends Comparable<T>> void probar(String titulo, T[] original) {\n        System.out.println(\"=========================================================\");\n        System.out.println(titulo + \" (\" + original.length + \" elementos)\");\n        System.out.println(\"=========================================================\");\n        System.out.println(\"Muestra original: \" + muestra(original));\n        T[] referencia = original.clone();\n        Arrays.sort(referencia);                    // solo para VERIFICAR el resultado\n\n        for (int id = 0; id < NOMBRES_METODOS.length; id++) {\n            T[] prueba = original.clone();\n            if (!ejecutar(id, prueba)) {\n                System.out.printf(\"%-21s| No aplica a este tipo de dato%n\", NOMBRES_METODOS[id]);\n                continue;\n            }\n            boolean correcto = Arrays.equals(prueba, referencia);\n\n            for (int w = 0; w < CALENTAMIENTO; w++) ejecutar(id, original.clone());\n\n            long[] tiempos = new long[MEDICIONES];\n            long bytes = Long.MAX_VALUE, cComp = 0, cInter = 0, cIter = 0;\n            for (int r = 0; r < MEDICIONES; r++) {\n                // Lote de LOTE copias: se mide el tiempo total y se promedia\n                // (reduce el ruido del reloj en arreglos pequeños)\n                T[][] lote = (T[][]) new Comparable[LOTE][];\n                for (int c = 0; c < LOTE; c++) lote[c] = original.clone();\n                comp = 0; inter = 0; iter = 0;\n                long m0 = bytesAsignados();\n                long t0 = System.nanoTime();\n                ejecutar(id, lote[0]);\n                long t1 = System.nanoTime();\n                long m1 = bytesAsignados();\n                bytes = Math.min(bytes, m1 - m0);\n                cComp = comp; cInter = inter; cIter = iter;   // contadores de UNA sola ejecución\n                long t2 = System.nanoTime();\n                for (int c = 1; c < LOTE; c++) ejecutar(id, lote[c]);\n                long t3 = System.nanoTime();\n                tiempos[r] = (t1 - t0 + t3 - t2) / LOTE;\n            }\n            Arrays.sort(tiempos);\n            double ms = tiempos[MEDICIONES / 2] / 1_000_000.0;\n            System.out.println(String.format(ES,\n                \"%-21s| Comp: %-8d| Interc: %-8d| Iter: %-8d| Tiempo: %.3f ms | Memoria: %.2f KB | %s\",\n                NOMBRES_METODOS[id], cComp, cInter, cIter, ms, bytes / 1024.0,\n                correcto ? \"OK\" : \"ERROR\"));\n        }\n        System.out.println(\"Muestra ordenada: \" + muestra(referencia));\n        System.out.println();\n    }\n\n    static <T> String muestra(T[] a) {\n        StringBuilder sb = new StringBuilder(\"[\");\n        for (int i = 0; i < Math.min(8, a.length); i++) sb.append(i > 0 ? \", \" : \"\").append(a[i]);\n        return sb.append(a.length > 8 ? \", ...]\" : \"]\").toString();\n    }\n\n    static Integer[] boxear(int[] v) {\n        Integer[] r = new Integer[v.length];\n        for (int i = 0; i < v.length; i++) r[i] = v[i];\n        return r;\n    }\n\n}\n", "salida": "=========================================================\nORDENANDO ARRAY DE ENTE
