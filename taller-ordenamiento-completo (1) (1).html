ejorado\", \"Quick Sort\", \"Shell Sort\",\n        \"Selección Directa\", \"Inserción Simple\", \"Shaker\", \"MergeSort\",\n        \"RadixSort\", \"Método de Montículo\", \"Método del Cubo\", \"Counting Sort\"\n    };\n    static final boolean[] RECURSIVO = {\n        false, false, true, false, false, false, false, true, false, false, false, false\n    };\n\n    static <T extends Comparable<T>> int cmp(T a, T b) {\n        comp++;\n        return a.compareTo(b);\n    }\n\n    static <T> void swap(T[] a, int i, int j) {\n        inter++;\n        T t = a[i];\n        a[i] = a[j];\n        a[j] = t;\n    }\n\n    // ---------------------------------------------------------------------\n    // 1. Burbuja simple: recorre todo el arreglo n-1 veces\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void burbuja(T[] a) {\n        int n = a.length;\n        for (int i = 0; i < n - 1; i++) {\n            iter++;\n            for (int j = 0; j < n - i - 1; j++) {\n                iter++;\n                if (cmp(a[j], a[j + 1]) > 0) swap(a, j, j + 1);\n            }\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 2. Burbuja mejorado: se detiene si una pasada no intercambió nada y\n    //    el límite de la siguiente pasada es el último intercambio hecho\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void burbujaMejorado(T[] a) {\n        int limite = a.length - 1;\n        boolean huboCambio = true;\n        while (huboCambio) {\n            iter++;\n            huboCambio = false;\n            int ultimo = 0;\n            for (int j = 0; j < limite; j++) {\n                iter++;\n                if (cmp(a[j], a[j + 1]) > 0) {\n                    swap(a, j, j + 1);\n                    huboCambio = true;\n                    ultimo = j;\n                }\n            }\n            limite = ultimo;\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 3. QuickSort (recursivo, partición de Hoare, pivote = elemento central)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void quickSort(T[] a) {\n        if (a.length > 1) quick(a, 0, a.length - 1);\n    }\n\n    static <T extends Comparable<T>> void quick(T[] a, int izq, int der) {\n        int i = izq, j = der;\n        T pivote = a[(izq + der) / 2];\n        while (i <= j) {\n            iter++;\n            while (cmp(a[i], pivote) < 0) { i++; iter++; }\n            while (cmp(a[j], pivote) > 0) { j--; iter++; }\n            if (i <= j) {\n                if (i < j) swap(a, i, j);\n                i++;\n                j--;\n            }\n        }\n        if (izq < j) quick(a, izq, j);\n        if (i < der) quick(a, i, der);\n    }\n\n    // ---------------------------------------------------------------------\n    // 4. Shell Sort (secuencia original de Shell: n/2, n/4, ..., 1)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void shellSort(T[] a) {\n        int n = a.length;\n        for (int salto = n / 2; salto > 0; salto /= 2) {\n            iter++;\n            for (int i = salto; i < n; i++) {\n                iter++;\n                T clave = a[i];\n                int j = i;\n                while (j >= salto && cmp(a[j - salto], clave) > 0) {\n                    iter++;\n                    a[j] = a[j - salto];\n                    inter++;\n                    j -= salto;\n                }\n                if (j != i) { a[j] = clave; inter++; }\n            }\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 5. Selección directa\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void seleccion(T[] a) {\n        int n = a.length;\n        for (int i = 0; i < n - 1; i++) {\n            iter++;\n            int menor = i;\n            for (int j = i + 1; j < n; j++) {\n                iter++;\n                if (cmp(a[j], a[menor]) < 0) menor = j;\n            }\n            if (menor != i) swap(a, i, menor);\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 6. Inserción simple\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void insercion(T[] a) {\n        for (int i = 1; i < a.length; i++) {\n            iter++;\n            T clave = a[i];\n            int j = i - 1;\n            while (j >= 0 && cmp(a[j], clave) > 0) {\n                iter++;\n                a[j + 1] = a[j];\n                inter++;\n                j--;\n            }\n            if (j + 1 != i) { a[j + 1] = clave; inter++; }\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 7. Shaker (burbuja bidireccional / cocktail sort)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void shaker(T[] a) {\n        int izq = 0, der = a.length - 1;\n        boolean huboCambio = true;\n        while (huboCambio && izq < der) {\n            iter++;\n            huboCambio = false;\n            for (int j = izq; j < der; j++) {          // ida: sube el mayor\n                iter++;\n                if (cmp(a[j], a[j + 1]) > 0) { swap(a, j, j + 1); huboCambio = true; }\n            }\n            der--;\n            for (int j = der; j > izq; j--) {          // vuelta: baja el menor\n                iter++;\n                if (cmp(a[j - 1], a[j]) > 0) { swap(a, j - 1, j); huboCambio = true; }\n            }\n            izq++;\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 8. MergeSort (recursivo, de arriba hacia abajo, arreglo auxiliar único)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void mergeSort(T[] a) {\n        T[] aux = Arrays.copyOf(a, a.length);\n        merge(a, aux, 0, a.length - 1);\n    }\n\n    static <T extends Comparable<T>> void merge(T[] a, T[] aux, int lo, int hi) {\n        if (lo >= hi) return;\n        int mid = (lo + hi) >>> 1;\n        merge(a, aux, lo, mid);\n        merge(a, aux, mid + 1, hi);\n        for (int k = lo; k <= hi; k++) { iter++; aux[k] = a[k]; }\n        int i = lo, j = mid + 1;\n        for (int k = lo; k <= hi; k++) {\n            iter++;\n            if (i > mid)                      a[k] = aux[j++];\n            else if (j > hi)                  a[k] = aux[i++];\n            else if (cmp(aux[j], aux[i]) < 0) a[k] = aux[j++];\n            else                              a[k] = aux[i++];\n            inter++;\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 9. RadixSort LSD (no compara elementos entre sí)\n    //    Enteros no negativos: base 10 | Strings: un carácter por pasada\n    // ---------------------------------------------------------------------\n    static void radixEnteros(Integer[] a) {\n        int n = a.length;\n        int max = 0;\n        for (int k = 0; k < n; k++) { iter++; if (a[k] > max) max = a[k]; }\n        Integer[] salida = new Integer[n];\n        for (int exp = 1; max / exp > 0; exp *= 10) {\n            iter++;\n            int[] cuenta = new int[10];\n            for (int k = 0; k < n; k++) { iter++; cuenta[(a[k] / exp) % 10]++; }\n            for (int d = 1; d < 10; d++) { iter++; cuenta[d] += cuenta[d - 1]; }\n            for (int k = n - 1; k >= 0; k--) {\n                iter++;\n                salida[--cuenta[(a[k] / exp) % 10]] = a[k];\n                inter++;\n            }\n            for (int k = 0; k < n; k++) { iter++; a[k] = salida[k]; inter++; }\n        }\n    }\n\n    static void radixStrings(String[] a) {\n        int n = a.length;\n        int largo = 0, maxChar = 0;\n        for (int k = 0; k < n; k++) {\n            iter++;\n            largo = Math.max(largo, a[k].length());\n            for (int c = 0; c < a[k].length(); c++) { iter++; maxChar = Math.max(maxChar, a[k].charAt(c)); }\n        }\n        int R = maxChar + 2;                       // 0 = \"sin carácter\" (más corta primero)\n        String[] salida = new String[n];\n        for (int pos = largo - 1; pos >= 0; pos--) {\n            iter++;\n            int[] cuenta = new int[R + 1];\n            for (int k = 0; k < n; k++) { iter++; cuenta[clave(a[k], pos) + 1]++; }\n            for (int r = 0; r < R; r++) { iter++; cuenta[r + 1] += cuenta[r]; }\n            for (int k = 0; k < n; k++) { iter++; salida[cuenta[clave(a[k], pos)]++] = a[k]; inter++; }\n            for (int k = 0; k < n; k++) { iter++; a[k] = salida[k]; inter++; }\n        }\n    }\n\n    static int clave(String s, int pos) {\n        return pos < s.length() ? s.charAt(pos) + 1 : 0;\n    }\n\n    // ---------------------------------------------------------------------\n    // 10. Método de Montículo (HeapSort, iterativo, montículo máximo)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void monticulo(T[] a) {\n        int n = a.length;\n        for (int i = n / 2 - 1; i >= 0; i--) { iter++; hundir(a, i, n); }\n        for (int fin = n - 1; fin > 0; fin--) {\n            iter++;\n            swap(a, 0, fin);\n            hundir(a, 0, fin);\n        }\n    }\n\n    static <T extends Comparable<T>> void hundir(T[] a, int i, int tam) {\n        while (2 * i + 1 < tam) {\n            iter++;\n            int hijo = 2 * i + 1;\n            if (hijo + 1 < tam && cmp(a[hijo + 1], a[hijo]) > 0) hijo++;\n            if (cmp(a[i], a[hijo]) >= 0) break;\n            swap(a, i, hijo);\n            i = hijo;\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 11. Método del Cubo (Bucket Sort): reparte en cubos y ordena cada cubo\n    //     con inserción. Enteros: por rango de valor | Strings: 1ª letra\n    // ---------------------------------------------------------------------\n    static void cuboEnteros(Integer[] a) {\n        int n = a.length;\n        int min = a[0], max = a[0];\n        for (int k = 1; k < n; k++) { iter++; if (a[k] < min) min = a[k]; if (a[k] > max) max = a[k]; }\n        int cubos = n;\n        long rango = (long) max - min + 1;\n        int[] idx = new int[n];\n        int[] inicio = new int[cubos + 1];\n        for (int k = 0; k < n; k++) {\n            iter++;\n            idx[k] = (int) ((a[k] - min) * (long) cubos / rango);\n            inicio[idx[k] + 1]++;\n        }\n        repartirYOrdenar(a, idx, inicio, cubos);\n    }\n\n    static void cuboStrings(String[] a) {\n        int n = a.length;\n        int min = Integer.MAX_VALUE, max = 0;\n        for (int k = 0; k < n; k++) {\n            iter++;\n            int c = a[k].isEmpty() ? 0 : a[k].charAt(0);\n            min = Math.min(min, c);\n            max = Math.max(max, c);\n        }\n        int cubos = max - min + 1;\n        int[] idx = new int[n];\n        int[] inicio = new int[cubos + 1];\n        for (int k = 0; k < n; k++) {\n            iter++;\n            idx[k] = (a[k].isEmpty() ? 0 : a[k].charAt(0)) - min;\n            inicio[idx[k] + 1]++;\n        }\n        repartirYOrdenar(a, idx, inicio, cubos);\n    }\n\n    static <T extends Comparable<T>> void repartirYOrdenar(T[] a, int[] idx, int[] inicio, int cubos) {\n        int n = a.length;\n        for (int b = 0; b < cubos; b++) { iter++; inicio[b + 1] += inicio[b]; }\n        T[] aux = Arrays.copyOf(a, n);\n        int[] sig = Arrays.copyOf(inicio, cubos);\n        for (int k = 0; k < n; k++) { iter++; aux[sig[idx[k]]++] = a[k]; inter++; }\n        for (int b = 0; b < cubos; b++) {          // inserción dentro de cada cubo\n            iter++;\n            for (int i = inicio[b] + 1; i < inicio[b + 1]; i++) {\n                iter++;\n                T clave = aux[i];\n                int j = i - 1;\n                while (j >= inicio[b] && cmp(aux[j], clave) > 0) {\n                    iter++;\n                    aux[j + 1] = aux[j];\n                    inter++;\n                    j--;\n                }\n                if (j + 1 != i) { aux[j + 1] = clave; inter++; }\n            }\n        }\n        for (int k = 0; k < n; k++) { iter++; a[k] = aux[k]; inter++; }\n    }\n\n    // ---------------------------------------------------------------------\n    // 12. Counting Sort (solo enteros: necesita claves enteras en un rango)\n    // ---------------------------------------------------------------------\n    static void countingSort(Integer[] a) {\n        int n = a.length;\n        int min = a[0], max = a[0];\n        for (int k = 1; k < n; k++) { iter++; if (a[k] < min) min = a[k]; if (a[k] > max) max = a[k]; }\n        int[] cuenta = new int[max - min + 1];\n        for (int k = 0; k < n; k++) { iter++; cuenta[a[k] - min]++; }\n        int pos = 0;\n        for (int v = 0; v < cuenta.length; v++) {\n            iter++;\n            while (cuenta[v]-- > 0) { iter++; a[pos++] = v + min; inter++; }\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // Despachador: ejecuta el método 'id' sobre el arreglo\n    // Retorna false si el método no aplica a ese tipo de dato\n    // ---------------------------------------------------------------------\n    @SuppressWarnings(\"unchecked\")\n    static <T extends Comparable<T>> boolean ejecutar(int id, T[] a) {\n        boolean esInt = a instanceof Integer[];\n        switch (id) {\n            case 0:  burbuja(a);          return true;\n            case 1:  burbujaMejorado(a);  return true;\n            case 2:  quickSort(a);        return true;\n            case 3:  shellSort(a);        return true;\n            case 4:  seleccion(a);        return true;\n            case 5:  insercion(a);        return true;\n            case 6:  shaker(a);           return true;\n            case 7:  mergeSort(a);        return true;\n            case 8:  if (esInt) radixEnteros((Integer[]) a); else radixStrings((String[]) a); return true;\n            case 9:  monticulo(a);        return true;\n            case 10: if (esInt) cuboEnteros((Integer[]) a); else cuboStrings((String[]) a); return true;\n            case 11: if (esInt) { countingSort((Integer[]) a); return true; } return false;\n            default: return false;\n        }\n    }\n\n    // =====================================================================\n    //  MEDICIÓN\n    //   - Tiempo   : mediana de 21 lotes de 20 ejecuciones (tras 1500 de calentamiento JIT)\n    //   - Memoria  : bytes asignados en el heap por el hilo durante el\n    //                ordenamiento (memoria auxiliar), mínimo de las ejecuciones\n    // =====================================================================\n    // Los resultados del taller se midieron con CALENTAMIENTO=1500, MEDICIONES=21 y\n    // LOTE=20 en una JVM local. Estos valores ligeros permiten ejecutarlo en un IDE\n    // online sin pasar el límite de tiempo (comparaciones, intercambios, iteraciones\n    // y memoria NO cambian; solo el tiempo se vuelve más ruidoso).\n    static final int CALENTAMIENTO = 60, MEDICIONES = 9, LOTE = 8;\n    static final Locale ES = Locale.forLanguageTag(\"es-CO\");\n    static final com.sun.management.ThreadMXBean TMX = obtenerTMX();\n\n    static com.sun.management.ThreadMXBean obtenerTMX() {\n        try {\n            java.lang.management.ThreadMXBean b = ManagementFactory.getThreadMXBean();\n            if (b instanceof com.sun.management.ThreadMXBean) return (com.sun.management.ThreadMXBean) b;\n        } catch (Throwable t) { }\n        return null;                                   // memoria no disponible en este entorno\n    }\n\n    static long bytesAsignados() {\n        return TMX != null ? TMX.getCurrentThreadAllocatedBytes() : 0;\n    }\n\n    @SuppressWarnings(\"unchecked\")\n    static <T extends Comparable<T>> void probar(String titulo, T[] original) {\n        System.out.println(\"=========================================================\");\n        System.out.println(titulo + \" (\" + original.length + \" elementos)\");\n        System.out.println(\"=========================================================\");\n        System.out.println(\"Muestra original: \" + muestra(original));\n        T[] referencia = original.clone();\n        Arrays.sort(referencia);                    // solo para VERIFICAR el resultado\n\n        for (int id = 0; id < NOMBRES_METODOS.length; id++) {\n            T[] prueba = original.clone();\n            if (!ejecutar(id, prueba)) {\n                System.out.printf(\"%-21s| No aplica a este tipo de dato%n\", NOMBRES_METODOS[id]);\n                continue;\n            }\n            boolean correcto = Arrays.equals(prueba, referencia);\n\n            for (int w = 0; w < CALENTAMIENTO; w++) ejecutar(id, original.clone());\n\n            long[] tiempos = new long[MEDICIONES];\n            long bytes = Long.MAX_VALUE, cComp = 0, cInter = 0, cIter = 0;\n            for (int r = 0; r < MEDICIONES; r++) {\n                // Lote de LOTE copias: se mide el tiempo total y se promedia\n                // (reduce el ruido del reloj en arreglos pequeños)\n                T[][] lote = (T[][]) new Comparable[LOTE][];\n                for (int c = 0; c < LOTE; c++) lote[c] = original.clone();\n                comp = 0; inter = 0; iter = 0;\n                long m0 = bytesAsignados();\n                long t0 = System.nanoTime();\n                ejecutar(id, lote[0]);\n                long t1 = System.nanoTime();\n                long m1 = bytesAsignados();\n                bytes = Math.min(bytes, m1 - m0);\n                cComp = comp; cInter = inter; cIter = iter;   // contadores de UNA sola ejecución\n                long t2 = System.nanoTime();\n                for (int c = 1; c < LOTE; c++) ejecutar(id, lote[c]);\n                long t3 = System.nanoTime();\n                tiempos[r] = (t1 - t0 + t3 - t2) / LOTE;\n            }\n            Arrays.sort(tiempos);\n            double ms = tiempos[MEDICIONES / 2] / 1_000_000.0;\n            System.out.println(String.format(ES,\n                \"%-21s| Comp: %-8d| Interc: %-8d| Iter: %-8d| Tiempo: %.3f ms | Memoria: %.2f KB | %s\",\n                NOMBRES_METODOS[id], cComp, cInter, cIter, ms, bytes / 1024.0,\n                correcto ? \"OK\" : \"ERROR\"));\n        }\n        System.out.println(\"Muestra ordenada: \" + muestra(referencia));\n        System.out.println();\n    }\n\n    static <T> String muestra(T[] a) {\n        StringBuilder sb = new StringBuilder(\"[\");\n        for (int i = 0; i < Math.min(8, a.length); i++) sb.append(i > 0 ? \", \" : \"\").append(a[i]);\n        return sb.append(a.length > 8 ? \", ...]\" : \"]\").toString();\n    }\n\n    static Integer[] boxear(int[] v) {\n        Integer[] r = new Integer[v.length];\n        for (int i = 0; i < v.length; i++) r[i] = v[i];\n        return r;\n    }\n\n}\n", "salida": "=========================================================\nORDENANDO ARRAY DE ENTEROS (500 elementos)\n=========================================================\nMuestra original: [5557, 4582, 7201, 4257, 5803, 7065, 2291, 3045, ...]\nBurbuja Simple       | Comp: 124750  | Interc: 56902   | Iter: 125249  | Tiempo: 0,680 ms | Memoria: 0,00 KB | OK\nBurbuja Mejorado     | Comp: 121539  | Interc: 56902   | Iter: 122014  | Tiempo: 1,011 ms | Memoria: 0,00 KB | OK\nQuick Sort           | Comp: 5287    | Interc: 1274    | Iter: 3832    | Tiempo: 0,013 ms | Memoria: 0,00 KB | OK\nShell Sort           | Comp: 5524    | Interc: 3631    | Iter: 57 c final boolean[] RECURSIVO = {\n        false, false, true, false, false, false, false, true, false, false, false, false\n    };\n\n    static <T extends Comparable<T>> int cmp(T a, T b) {\n        comp++;\n        return a.compareTo(b);\n    }\n\n    static <T> void swap(T[] a, int i, int j) {\n        inter++;\n        T t = a[i];\n        a[i] = a[j];\n        a[j] = t;\n    }\n\n    // ---------------------------------------------------------------------\n    // 1. Burbuja simple: recorre todo el arreglo n-1 veces\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void burbuja(T[] a) {\n        int n = a.length;\n        for (int i = 0; i < n - 1; i++) {\n            iter++;\n            for (int j = 0; j < n - i - 1; j++) {\n                iter++;\n                if (cmp(a[j], a[j + 1]) > 0) swap(a, j, j + 1);\n            }\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 2. Burbuja mejorado: se detiene si una pasada no intercambió nada y\n    //    el límite de la siguiente pasada es el último intercambio hecho\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void burbujaMejorado(T[] a) {\n        int limite = a.length - 1;\n        boolean huboCambio = true;\n        while (huboCambio) {\n            iter++;\n            huboCambio = false;\n            int ultimo = 0;\n            for (int j = 0; j < limite; j++) {\n                iter++;\n                if (cmp(a[j], a[j + 1]) > 0) {\n                    swap(a, j, j + 1);\n                    huboCambio = true;\n                    ultimo = j;\n                }\n            }\n            limite = ultimo;\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 3. QuickSort (recursivo, partición de Hoare, pivote = elemento central)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void quickSort(T[] a) {\n        if (a.length > 1) quick(a, 0, a.length - 1);\n    }\n\n    static <T extends Comparable<T>> void quick(T[] a, int izq, int der) {\n        int i = izq, j = der;\n        T pivote = a[(izq + der) / 2];\n        while (i <= j) {\n            iter++;\n            while (cmp(a[i], pivote) < 0) { i++; iter++; }\n            while (cmp(a[j], pivote) > 0) { j--; iter++; }\n            if (i <= j) {\n                if (i < j) swap(a, i, j);\n                i++;\n                j--;\n            }\n        }\n        if (izq < j) quick(a, izq, j);\n        if (i < der) quick(a, i, der);\n    }\n\n    // ---------------------------------------------------------------------\n    // 4. Shell Sort (secuencia original de Shell: n/2, n/4, ..., 1)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void shellSort(T[] a) {\n        int n = a.length;\n        for (int salto = n / 2; salto > 0; salto /= 2) {\n            iter++;\n            for (int i = salto; i < n; i++) {\n                iter++;\n                T clave = a[i];\n                int j = i;\n                while (j >= salto && cmp(a[j - salto], clave) > 0) {\n                    iter++;\n                    a[j] = a[j - salto];\n                    inter++;\n                    j -= salto;\n                }\n                if (j != i) { a[j] = clave; inter++; }\n            }\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 5. Selección directa\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void seleccion(T[] a) {\n        int n = a.length;\n        for (int i = 0; i < n - 1; i++) {\n            iter++;\n            int menor = i;\n            for (int j = i + 1; j < n; j++) {\n                iter++;\n                if (cmp(a[j], a[menor]) < 0) menor = j;\n            }\n            if (menor != i) swap(a, i, menor);\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 6. Inserción simple\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void insercion(T[] a) {\n        for (int i = 1; i < a.length; i++) {\n            iter++;\n            T clave = a[i];\n            int j = i - 1;\n            while (j >= 0 && cmp(a[j], clave) > 0) {\n                iter++;\n                a[j + 1] = a[j];\n                inter++;\n                j--;\n            }\n            if (j + 1 != i) { a[j + 1] = clave; inter++; }\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 7. Shaker (burbuja bidireccional / cocktail sort)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void shaker(T[] a) {\n        int izq = 0, der = a.length - 1;\n        boolean huboCambio = true;\n        while (huboCambio && izq < der) {\n            iter++;\n            huboCambio = false;\n            for (int j = izq; j < der; j++) {          // ida: sube el mayor\n                iter++;\n                if (cmp(a[j], a[j + 1]) > 0) { swap(a, j, j + 1); huboCambio = true; }\n            }\n            der--;\n            for (int j = der; j > izq; j--) {          // vuelta: baja el menor\n                iter++;\n                if (cmp(a[j - 1], a[j]) > 0) { swap(a, j - 1, j); huboCambio = true; }\n            }\n            izq++;\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 8. MergeSort (recursivo, de arriba hacia abajo, arreglo auxiliar único)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void mergeSort(T[] a) {\n        T[] aux = Arrays.copyOf(a, a.length);\n        merge(a, aux, 0, a.length - 1);\n    }\n\n    static <T extends Comparable<T>> void merge(T[] a, T[] aux, int lo, int hi) {\n        if (lo >= hi) return;\n        int mid = (lo + hi) >>> 1;\n        merge(a, aux, lo, mid);\n        merge(a, aux, mid + 1, hi);\n        for (int k = lo; k <= hi; k++) { iter++; aux[k] = a[k]; }\n        int i = lo, j = mid + 1;\n        for (int k = lo; k <= hi; k++) {\n            iter++;\n            if (i > mid)                      a[k] = aux[j++];\n            else if (j > hi)                  a[k] = aux[i++];\n            else if (cmp(aux[j], aux[i]) < 0) a[k] = aux[j++];\n            else                              a[k] = aux[i++];\n            inter++;\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 9. RadixSort LSD (no compara elementos entre sí)\n    //    Enteros no negativos: base 10 | Strings: un carácter por pasada\n    // ---------------------------------------------------------------------\n    static void radixEnteros(Integer[] a) {\n        int n = a.length;\n        int max = 0;\n        for (int k = 0; k < n; k++) { iter++; if (a[k] > max) max = a[k]; }\n        Integer[] salida = new Integer[n];\n        for (int exp = 1; max / exp > 0; exp *= 10) {\n            iter++;\n            int[] cuenta = new int[10];\n            for (int k = 0; k < n; k++) { iter++; cuenta[(a[k] / exp) % 10]++; }\n            for (int d = 1; d < 10; d++) { iter++; cuenta[d] += cuenta[d - 1]; }\n            for (int k = n - 1; k >= 0; k--) {\n                iter++;\n                salida[--cuenta[(a[k] / exp) % 10]] = a[k];\n                inter++;\n            }\n            for (int k = 0; k < n; k++) { iter++; a[k] = salida[k]; inter++; }\n        }\n    }\n\n    static void radixStrings(String[] a) {\n        int n = a.length;\n        int largo = 0, maxChar = 0;\n        for (int k = 0; k < n; k++) {\n            iter++;\n            largo = Math.max(largo, a[k].length());\n            for (int c = 0; c < a[k].length(); c++) { iter++; maxChar = Math.max(maxChar, a[k].charAt(c)); }\n        }\n        int R = maxChar + 2;                       // 0 = \"sin carácter\" (más corta primero)\n        String[] salida = new String[n];\n        for (int pos = largo - 1; pos >= 0; pos--) {\n            iter++;\n            int[] cuenta = new int[R + 1];\n            for (int k = 0; k < n; k++) { iter++; cuenta[clave(a[k], pos) + 1]++; }\n            for (int r = 0; r < R; r++) { iter++; cuenta[r + 1] += cuenta[r]; }\n            for (int k = 0; k < n; k++) { iter++; salida[cuenta[clave(a[k], pos)]++] = a[k]; inter++; }\n            for (int k = 0; k < n; k++) { iter++; a[k] = salida[k]; inter++; }\n        }\n    }\n\n    static int clave(String s, int pos) {\n        return pos < s.length() ? s.charAt(pos) + 1 : 0;\n    }\n\n    // ---------------------------------------------------------------------\n    // 10. Método de Montículo (HeapSort, iterativo, montículo máximo)\n    // ---------------------------------------------------------------------\n    static <T extends Comparable<T>> void monticulo(T[] a) {\n        int n = a.length;\n        for (int i = n / 2 - 1; i >= 0; i--) { iter++; hundir(a, i, n); }\n        for (int fin = n - 1; fin > 0; fin--) {\n            iter++;\n            swap(a, 0, fin);\n            hundir(a, 0, fin);\n        }\n    }\n\n    static <T extends Comparable<T>> void hundir(T[] a, int i, int tam) {\n        while (2 * i + 1 < tam) {\n            iter++;\n            int hijo = 2 * i + 1;\n            if (hijo + 1 < tam && cmp(a[hijo + 1], a[hijo]) > 0) hijo++;\n            if (cmp(a[i], a[hijo]) >= 0) break;\n            swap(a, i, hijo);\n            i = hijo;\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // 11. Método del Cubo (Bucket Sort): reparte en cubos y ordena cada cubo\n    //     con inserción. Enteros: por rango de valor | Strings: 1ª letra\n    // ---------------------------------------------------------------------\n    static void cuboEnteros(Integer[] a) {\n        int n = a.length;\n        int min = a[0], max = a[0];\n        for (int k = 1; k < n; k++) { iter++; if (a[k] < min) min = a[k]; if (a[k] > max) max = a[k]; }\n        int cubos = n;\n        long rango = (long) max - min + 1;\n        int[] idx = new int[n];\n        int[] inicio = new int[cubos + 1];\n        for (int k = 0; k < n; k++) {\n            iter++;\n            idx[k] = (int) ((a[k] - min) * (long) cubos / rango);\n            inicio[idx[k] + 1]++;\n        }\n        repartirYOrdenar(a, idx, inicio, cubos);\n    }\n\n    static void cuboStrings(String[] a) {\n        int n = a.length;\n        int min = Integer.MAX_VALUE, max = 0;\n        for (int k = 0; k < n; k++) {\n            iter++;\n            int c = a[k].isEmpty() ? 0 : a[k].charAt(0);\n            min = Math.min(min, c);\n            max = Math.max(max, c);\n        }\n        int cubos = max - min + 1;\n        int[] idx = new int[n];\n        int[] inicio = new int[cubos + 1];\n        for (int k = 0; k < n; k++) {\n            iter++;\n            idx[k] = (a[k].isEmpty() ? 0 : a[k].charAt(0)) - min;\n            inicio[idx[k] + 1]++;\n        }\n        repartirYOrdenar(a, idx, inicio, cubos);\n    }\n\n    static <T extends Comparable<T>> void repartirYOrdenar(T[] a, int[] idx, int[] inicio, int cubos) {\n        int n = a.length;\n        for (int b = 0; b < cubos; b++) { iter++; inicio[b + 1] += inicio[b]; }\n        T[] aux = Arrays.copyOf(a, n);\n        int[] sig = Arrays.copyOf(inicio, cubos);\n        for (int k = 0; k < n; k++) { iter++; aux[sig[idx[k]]++] = a[k]; inter++; }\n        for (int b = 0; b < cubos; b++) {          // inserción dentro de cada cubo\n            iter++;\n            for (int i = inicio[b] + 1; i < inicio[b + 1]; i++) {\n                iter++;\n                T clave = aux[i];\n                int j = i - 1;\n                while (j >= inicio[b] && cmp(aux[j], clave) > 0) {\n                    iter++;\n                    aux[j + 1] = aux[j];\n                    inter++;\n                    j--;\n                }\n                if (j + 1 != i) { aux[j + 1] = clave; inter++; }\n            }\n        }\n        for (int k = 0; k < n; k++) { iter++; a[k] = aux[k]; inter++; }\n    }\n\n    // ---------------------------------------------------------------------\n    // 12. Counting Sort (solo enteros: necesita claves enteras en un rango)\n    // ---------------------------------------------------------------------\n    static void countingSort(Integer[] a) {\n        int n = a.length;\n        int min = a[0], max = a[0];\n        for (int k = 1; k < n; k++) { iter++; if (a[k] < min) min = a[k]; if (a[k] > max) max = a[k]; }\n        int[] cuenta = new int[max - min + 1];\n        for (int k = 0; k < n; k++) { iter++; cuenta[a[k] - min]++; }\n        int pos = 0;\n        for (int v = 0; v < cuenta.length; v++) {\n            iter++;\n            while (cuenta[v]-- > 0) { iter++; a[pos++] = v + min; inter++; }\n        }\n    }\n\n    // ---------------------------------------------------------------------\n    // Despachador: ejecuta el método 'id' sobre el arreglo\n    // Retorna false si el método no aplica a ese tipo de dato\n    // ---------------------------------------------------------------------\n    @SuppressWarnings(\"unchecked\")\n    static <T extends Comparable<T>> boolean ejecutar(int id, T[] a) {\n        boolean esInt = a instanceof Integer[];\n        switch (id) {\n            case 0:  burbuja(a);          return true;\n            case 1:  burbujaMejorado(a);  return true;\n            case 2:  quickSort(a);        return true;\n            case 3:  shellSort(a);        return true;\n            case 4:  seleccion(a);        return true;\n            case 5:  insercion(a);        return true;\n            case 6:  shaker(a);           return true;\n            case 7:  mergeSort(a);        return true;\n            case 8:  if (esInt) radixEnteros((Integer[]) a); else radixStrings((String[]) a); return true;\n            case 9:  monticulo(a);        return true;\n            case 10: if (esInt) cuboEnteros((Integer[]) a); else cuboStrings((String[]) a); return true;\n            case 11: if (esInt) { countingSort((Integer[]) a); return true; } return false;\n            default: return false;\n        }\n    }\n\n    // =====================================================================\n    //  MEDICIÓN\n    //   - Tiempo   : mediana de 21 lotes de 20 ejecuciones (tras 1500 de calentamiento JIT)\n    //   - Memoria  : bytes asignados en el heap por el hilo durante el\n    //                ordenamiento (memoria auxiliar), mínimo de las ejecuciones\n    // =====================================================================\n    // Los resultados del taller se midieron con CALENTAMIENTO=1500, MEDICIONES=21 y\n    // LOTE=20 en una JVM local. Estos valores ligeros permiten ejecutarlo en un IDE\n    // online sin pasar el límite de tiempo (comparaciones, intercambios, iteraciones\n    // y memoria NO cambian; solo el tiempo se vuelve más ruidoso).\n    static final int CALENTAMIENTO = 60, MEDICIONES = 9, LOTE = 8;\n    static final Locale ES = Locale.forLanguageTag(\"es-CO\");\n    static final com.sun.management.ThreadMXBean TMX = obtenerTMX();\n\n    static com.sun.management.ThreadMXBean obtenerTMX() {\n        try {\n            java.lang.management.ThreadMXBean b = ManagementFactory.getThreadMXBean();\n            if (b instanceof com.sun.management.ThreadMXBean) return (com.sun.management.ThreadMXBean) b;\n        } catch (Throwable t) { }\n        return null;                                   // memoria no disponible en este entorno\n    }\n\n    static long bytesAsignados() {\n        return TMX != null ? TMX.getCurrentThreadAllocatedBytes() : 0;\n    }\n\n    @SuppressWarnings(\"unchecked\")\n    static <T extends Comparable<T>> void probar(String titulo, T[] original) {\n        System.out.println(\"=========================================================\");\n        System.out.println(titulo + \" (\" + original.length + \" elementos)\");\n        System.out.println(\"=========================================================\");\n        System.out.println(\"Muestra original: \" + muestra(original));\n        T[] referencia = original.clone();\n        Arrays.sort(referencia);                    // solo para VERIFICAR el resultado\n\n        for (int id = 0; id < NOMBRES_METODOS.length; id++) {\n            T[] prueba = original.clone();\n            if (!ejecutar(id, prueba)) {\n                System.out.printf(\"%-21s| No aplica a este tipo de dato%n\", NOMBRES_METODOS[id]);\n                continue;\n            }\n            boolean correcto = Arrays.equals(prueba, referencia);\n\n            for (int w = 0; w < CALENTAMIENTO; w++) ejecutar(id, original.clone());\n\n            long[] tiempos = new long[MEDICIONES];\n            long bytes = Long.MAX_VALUE, cComp = 0, cInter = 0, cIter = 0;\n            for (int r = 0; r < MEDICIONES; r++) {\n                // Lote de LOTE copias: se mide el tiempo total y se promedia\n                // (reduce el ruido del reloj en arreglos pequeños)\n                T[][] lote = (T[][]) new Comparable[LOTE][];\n                for (int c = 0; c < LOTE; c++) lote[c] = original.clone();\n                comp = 0; inter = 0; iter = 0;\n                long m0 = bytesAsignados();\n                long t0 = System.nanoTime();\n                ejecutar(id, lote[0]);\n                long t1 = System.nanoTime();\n                long m1 = bytesAsignados();\n                bytes = Math.min(bytes, m1 - m0);\n                cComp = comp; cInter = inter; cIter = iter;   // contadores de UNA sola ejecución\n                long t2 = System.nanoTime();\n                for (int c = 1; c < LOTE; c++) ejecutar(id, lote[c]);\n                long t3 = System.nanoTime();\n                tiempos[r] = (t1 - t0 + t3 - t2) / LOTE;\n            }\n            Arrays.sort(tiempos);\n            double ms = tiempos[MEDICIONES / 2] / 1_000_000.0;\n            System.out.println(String.format(ES,\n                \"%-21s| Comp: %-8d| Interc: %-8d| Iter: %-8d| Tiempo: %.3f ms | Memoria: %.2f KB | %s\",\n                NOMBRES_METODOS[id], cComp, cInter, cIter, ms, bytes / 1024.0,\n                correcto ? \"OK\" : \"ERROR\"));\n        }\n        System.out.println(\"Muestra ordenada: \" + muestra(referencia));\n        System.out.println();\n    }\n\n    static <T> String muestra(T[] a) {\n        StringBuilder sb = new StringBuilder(\"[\");\n        for (int i = 0; i < Math.min(8, a.length); i++) sb.append(i > 0 ? \", \" : \"\").append(a[i]);\n        return sb.append(a.length > 8 ? \", ...]\" : \"]\").toString();\n    }\n\n    static Integer[] boxear(int[] v) {\n        Integer[] r = new Integer[v.length];\n        for (int i = 0; i < v.length; i++) r[i] = v[i];\n        return r;\n    }\n\n}\n", "salida": "=========================================================\nORDENANDO ARRAY DE ENTEROS (499 elementos)\n=========================================================\nMuestra original: [2824, 1409, 5506, 5012, 4657, 3286, 2679, 9935, ...]\nBurbuja Simple       | Comp: 124251  | Interc: 49156   | Iter: 124749  | Tiempo: 0,335 ms | Memoria: 0,00 KB | OK\nBurbuja Mejorado     | Comp: 53722   | Interc: 49156   | Iter: 53847   | Tiempo: 0,247 ms | Memoria: 0,00 KB | OK\nQuick Sort           | Comp: 6560    | Interc: 913     | Iter: 5393    | Tiempo: 0,014 ms | Memoria: 0,00 KB | OK\nShell Sort           | Comp: 4769    | Interc: 2564    | Iter: 5022    | Tiempo: 0,017 ms | Memoria: 0,00 KB | OK\nSelección Directa    | Comp: 124251  | Interc: 494     | Iter: 124749  | Tiempo: 0,245 ms | Memoria: 0,00 KB | OK\nInserción Simple     | Comp: 49650   | Interc: 49652   | Iter: 49 Sort            | Comp: 0       | Interc: 9840    | Iter: 20803   | Tiempo: 0,052 ms | Memoria: 13,34 KB | OK\nMétodo de Montículo  | Comp: 5878    | Interc: 3045    | Iter: 3560    | Tiempo: 0,037 ms | Memoria: 0,00 KB | OK\nMétodo del Cubo      | Comp: 4617    | Interc: 5448    | Iter: 6545    | Tiempo: 0,048 ms | Memoria: 4,28 KB | OK\nCounting Sort        | No aplica a este tipo de dato\nMuestra ordenada: [Abril, Abril, Aida, Aida, Aitor, Alana, Alba, Albert, ...]", "notas": "1) Enteros (n=499): mejor método Quick Sort — 0,014 ms, 6.560 comparaciones, 0 KB. El Cubo midió menos tiempo (0,007 ms) pero usa 7,88 KB extra y depende de datos bien repartidos. Peor: Burbuja Simple (0,335 ms).\n\n2) Strings (n=410): mejor método Quick Sort (Shell Sort rinde casi igual) — 0,027 ms, 4.441 comparaciones, 0 KB. Peor: Shaker (0,629 ms). Counting Sort no aplica a Strings.\n\n3) Hallazgo: Los enteros traen un tramo final ordenado de 375: Burbuja Mejorado baja de 124.251 a 53.722 comparaciones (−57%), el único caso donde se diferencia de la Simple.", "stats": [{"algoritmo": "Burbuja Simple", "comparaciones": "124251", "intercambios": "49156", "iteraciones": "124749", "tiempoMs": "0,335", "memoriaKB": "0,00"}, {"algoritmo": "Burbuja Mejorado", "comparaciones": "53722", "intercambios": "49156", "iteraciones": "53847", "tiempoMs": "0,247", "memoriaKB": "0,00"}, {"algoritmo": "Quick Sort", "comparaciones": "6560", "intercambios": "913", "iteraciones": "5393", "tiempoMs": "0,014", "memoriaKB": "0,00"}, {"algoritmo": "Shell Sort", "comparaciones": "4769", "intercambios": "2564", "iteraciones": "5022", "tiempoMs": "0,017", "memoriaKB": "0,00"}, {"algoritmo": "Selección Directa", "comparaciones": "124251", "intercambios": "494", "iteraciones": "124749", "tiempoMs": "0,245", "memoriaKB": "0,00"}, {"algoritmo": "Inserción Simple", "comparaciones": "49650", "intercambios": "49652", "iteraciones": "49654", "tiempoMs": "0,159", "memoriaKB": "0,00"}, {"algoritmo": "Shaker", "comparaciones": " eros) y Burbuja Simple (Strings); en general los métodos cuadráticos hacen entre 8 y 74 veces más comparaciones que el mejor n·log n de cada caso.\n\n3) Sobre la memoria en 0,00 KB (Burbuja, Burbuja Mejorado, Quick, Shell, Selección, Inserción, Shaker y Montículo): es un resultado real, no un error. Son métodos \"en sitio\": solo usan variables locales (primitivos en la pila) y no crean arreglos ni objetos en el heap; la medición cuenta los bytes asignados en el heap, y la pila de recursión de QuickSort (O(log n)) no se incluye. Los que sí muestran memoria crean estructuras auxiliares: Merge (arreglo auxiliar, ~1–3 KB), Radix y Cubo (auxiliares y conteos) y Counting Sort (arreglo de conteo, hasta 45,48 KB).\n\n4) Precisión: con arreglos de 200–700 elementos, diferencias menores a ~0,02 ms no son concluyentes (QuickSort y Cubo en Strings oscilaron entre 0,01 y 0,3 ms entre corridas); comparaciones, intercambios, iteraciones y memoria sí son exactos.", "stats": [{"algoritmo": "Burbuja Simple (Σ5)", "comparaciones": "719281", "intercambios": "442529", "iteraciones": "721940", "tiempoMs": "2,837", "memoriaKB": "0,00"}, {"algoritmo": "Burbuja Mejorado (Σ5)", "comparaciones": "641825", "intercambios": "442529", "iteraciones": "644026", "tiempoMs": "3,194", "memoriaKB": "0,00"}, {"algoritmo": "Quick Sort (Σ5)", "comparaciones": "30619", "intercambios": "4583", "iteraciones": "24658", "tiempoMs": "0,066", "memoriaKB": "0,00"}, {"algoritmo": "Shell Sort (Σ5)", "comparaciones": "31130", "intercambios": "22164", "iteraciones": "32809", "tiempoMs": "0,118", "memoriaKB": "0,00"}, {"algoritmo": "Selección Directa (Σ5)", "comparaciones": "719281", "intercambios": "2296", "iteraciones": "721940", "tiempoMs": "2,173", "memoriaKB": "0,00"}, {"algoritmo": "Inserción Simple (Σ5)", "comparaciones": "444503", "intercambios": "445160", "iteraciones": "445188", "tiempoMs": "1,141", "memoriaKB": "0,00"}, {"algoritmo": "Shaker (Σ5)", "comparaciones": "584289", "intercambios": "442529", "iter   let estado = {
    puntos: DATOS_INICIALES.puntos,
    activo: null
  };
  estado.activo = "__anim";
  document.getElementById("nombreProyecto").value = DATOS_INICIALES.nombreProyecto;

  const listaTabs = document.getElementById("listaTabs");
  const contenedorPuntos = document.getElementById("contenedorPuntos");
  const nombreProyecto = document.getElementById("nombreProyecto");

  function mostrarToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("mostrar");
    clearTimeout(t._timer);
    t._timer = setTimeout(()=> t.classList.remove("mostrar"), 1600);
  }

  function render(){
    // --- Tabs ---
    listaTabs.innerHTML = "";
    const tabAnim = document.createElement("div");
    tabAnim.className = "tab" + (estado.activo === "__anim" ? " activo" : "");
    tabAnim.innerHTML = `<span class="num">▶</span><span class="titulo-tab">Animaciones</span>`;
    tabAnim.addEventListener("click", () => { estado.activo = "__anim"; render(); });
    listaTabs.appendChild(tabAnim);
    estado.puntos.forEach((p, i) => {
      const tab = document.createElement("div");
      tab.className = "tab" + (p.id === estado.activo ? " activo" : "");
      tab.innerHTML = `
        <span class="num">${String(i+1).padStart(2,"0")}</span>
        <span class="titulo-tab">${escapeHTML(p.titulo)}</span>
        <span class="borrar-tab" title="Eliminar punto">×</span>
      `;
      tab.addEventListener("click", (e)=>{
        if(e.target.classList.contains("borrar-tab")){
          if(estado.puntos.length <= 1){ mostrarToast("Debe quedar al menos un punto"); return; }
          if(confirm(`¿Eliminar "${p.titulo}"? Esta acción no se puede deshacer.`)){
            estado.puntos = estado.puntos.filter(x => x.id !== p.id);
            if(estado.activo === p.id) estado.activo = estado.puntos[0].id;
            render();
          }
          return;
        }
        estado.activo = p.id;
        render();
      });
      listaTabs.appendChild(tab);
    });

    // --- Contenido (solo el punto activo, en pantalla) ---
    contenedorPuntos.innerHTML = "";
    if(estado.activo === "__anim"){ contenedorPuntos.appendChild(construirAnimaciones()); return; }
    const punto = estado.puntos.find(p => p.id === estado.activo);
    if(!punto) return;
    const idx = estado.puntos.indexOf(punto) + 1;
    contenedorPuntos.appendChild(construirSeccionPunto(punto, idx));
  }

    const sec = document.createElement("section");
    sec.className = "punto";

      <div class="encabezado-punto">

      </div>
      <textarea class="descripcion" data-campo="descripcion" rows="${Math.max(2, Math.ceil((punto.descripcion||'').length/105))}" spellcheck="false" placeholder="Descripción breve del ejercicio...">${escapeHTML(punto.descripcion)}</textarea>

      <section class="bloque">
        <h3>Código Java <span class="sub">pega aquí tu clase o método</span></h3>
        <div class="caja-codigo">
          <div class="barra">
            <button class="btn btn-mini" data-accion="copiar-codigo">Copiar código</button>
          </div>

public class Ejemplo {
    public static void main(String[] args) {
        // tu código aquí
    }
}">${escapeHTML(punto.codigo)}</textarea>
        </div>
      </section>

      <section class="bloque">
        <h3>Salida (Output) <span class="sub">pega la consola tal como aparece</span></h3>
        <div class="caja-salida">
          <textarea data-campo="salida" spellcheck="false" placeholder="Imprimir lista original:
Pedro Luis Ester Ana...">${escapeHTML(punto.salida)}</textarea>
        </div>

  // =====================================================================
  //  ANIMACIONES DE LOS 12 MÉTODOS (sección inicial)
  // =====================================================================
  const METODOS_ANIM = [
    {id:"burbuja", nombre:"Burbuja Simple", rec:false, str:true, tiempo:"O(n²)", mem:"O(1)",
     idea:"Recorre el arreglo comparando pares vecinos y los intercambia si están en desorden. Tras cada pasada completa, el mayor de los restantes 'burbujea' hasta su posición final (derecha)."},
    {id:"burbujaMej", nombre:"Burbuja Mejorado", rec:false, str:true, tiempo:"O(n²) · mejor caso O(n)", mem:"O(1)",
     idea:"Igual que la burbuja, pero se detiene si una pasada no hizo intercambios y la siguiente pasada solo llega hasta el último intercambio (lo que está después ya está ordenado)."},
    {id:"quick", nombre:"Quick Sort", rec:true, str:true, tiempo:"O(n log n) · peor caso O(n²)", mem:"O(log n) pila",
     idea:"Elige un pivote (aquí el elemento central) y reparte: a la izquierda lo menor y a la derecha lo mayor, intercambiando los pares mal ubicados. Luego repite recursivamente en cada lado."},
    {id:"shell", nombre:"Shell Sort", rec:false, str:true, tiempo:"≈ O(n^1,5)", mem:"O(1)",
     idea:"Inserción con saltos: ordena elementos separados por n/2, luego n/4, ... hasta 1. Los saltos grandes acercan rápido cada elemento a su lugar y la pasada final con salto 1 casi no tiene trabajo."},
    {id:"seleccion", nombre:"Selección Directa", rec:false, str:true, tiempo:"O(n²)", mem:"O(1)",
     idea:"En cada vuelta busca el mínimo de la parte no ordenada (se marca en morado) y lo intercambia con la primera posición libre. Hace muy pocos intercambios (≈ n/2)."},
    {id:"insercion", nombre:"Inserción Simple", rec:false, str:true, tiempo:"O(n²) · mejor caso O(n)", mem:"O(1)",
     idea:"Mantiene un prefijo ordenado (verde tenue). Toma el siguiente elemento (la clave), desplaza hacia la derecha los mayores y la deja en su hueco, como ordenar cartas en la mano."},
    {id:"shaker", nombre:"Shaker", rec:false, str:true, tiempo:"O(n²) · mejor caso O(n)", mem:"O(1)",
     idea:"Burbuja en dos direcciones: una pasada de ida sube el mayor al extremo derecho y una de vuelta baja el menor al extremo izquierdo. Los extremos se van cerrando."},
    {id:"merge", nombre:"MergeSort", rec:true, str:true, tiempo:"O(n log n)", mem:"O(n)",
     idea:"Divide el arreglo a la mitad recursivamente hasta tener elementos sueltos y luego mezcla dos mitades ordenadas usando un arreglo auxiliar (fila inferior), tomando siempre el menor de los dos frentes."},
    {id:"radix", nombre:"RadixSort", rec:false, str:true, tiempo:"O(d·(n+k))", mem:"O(n+k)",
     idea:"No compara elementos entre sí. Ordena por dígitos de derecha a izquierda (unidades, luego decenas) de forma estable usando un conteo por dígito y un arreglo auxiliar. En Strings se hace carácter por carácter."},
    {id:"heap", nombre:"Método de Montículo", rec:false, str:true, tiempo:"O(n log n)", mem:"O(1)",
     idea:"Primero convierte el arreglo en un montículo máximo (cada padre ≥ sus hijos; hijos de i en 2i+1 y 2i+2). Luego manda la raíz (el mayor) al final y 'hunde' el nuevo elemento de la raíz para reparar el montículo."},
    {id:"cubo", nombre:"Método del Cubo", rec:false, str:true, tiempo:"O(n+k) · peor caso O(n²)", mem:"O(n+k)",
     idea:"Reparte los elementos en cubos por rango de valor (aquí decenas: 10-19, 20-29, ...; cada cubo con un color). Cada cubo se ordena con inserción y luego se concatenan. En Strings los cubos son por primera letra."},
    {id:"counting", nombre:"Counting Sort", rec:false, str:false, tiempo:"O(n+k)", mem:"O(k)",
     idea:"Cuenta cuántas veces aparece cada valor en un arreglo de conteo (fila inferior: índice = valor) y luego reescribe el arreglo en orden. No compara; solo sirve con claves enteras en un rango acotado, por eso no aplica a Strings."},
  ];

  function construirAnimaciones(){
    const sec = document.createElement("section");
    sec.className = "punto anim";
    sec.innerHTML = `
      <div class="encabezado-punto">
        <span class="num-grande">▶</span>
        <h1 class="titulo-anim">Animaciones de los métodos de ordenamiento</h1>
      </div>
      <p class="desc-anim">Elige un método y pulsa Reproducir. Cada barra es un elemento (su altura es su valor). La animación usa números de 10 a 99; con Strings la lógica es idéntica, comparando alfabéticamente. Los contadores son los de esta animación y siguen la misma lógica del código del taller.</p>
      <div class="anim-metodos" id="animMetodos"></div>
      <section class="bloque anim-bloque">
        <div class="anim-info" id="animInfo"></div>
        <canvas id="animCanvas"></canvas>
        <div class="anim-leyenda">
          <span><i style="background:#4f6b95"></i>Sin tocar</span>
          <span><i style="background:#f5a524"></i>Comparando / leyendo</span>
          <span><i style="background:#f0655f"></i>Intercambio / escritura</span>
          <span><i style="background:#a78bfa"></i>Pivote / mínimo</span>
          <span><i style="background:#34d399"></i>Ya ordenado</span>
        </div>
        <div class="anim-msg" id="animMsg">&nbsp;</div>
        <div class="anim-ctrl">
          <button class="btn btn-amber" id="animPlay">▶ Reproducir</button>
          <button class="btn" id="animPaso">⏭ Paso</button>
          <button class="btn" id="animReset">↺ Reiniciar</button>
          <button class="btn" id="animNuevo">🔀 Nuevo arreglo</button>
          <label>Datos
            <select id="animTipo">
              <option value="aleatorio">Desordenados</option>
              <option value="casi">Casi ordenados</option>
              <option value="invertido">Invertidos</option>
              <option value="repetidos">Con repetidos</option>
            </select>
          </label>
          <label>Tamaño
            <select id="animTam"><option>12</option><option selected>20</option><option>30</option><option>40</option></select>
          </label>
          <label>Velocidad
            <input type="range" id="animVel" min="1" max="100" value="14"> <span id="animVelTxt"></span>
          </label>
        </div>
        <div class="anim-cont" id="animCont"></div>
      </section>`;

    const $ = id => sec.querySelector("#" + id);
    const canvas = $("animCanvas"), ctx = canvas.getContext("2d");
    let metodo = METODOS_ANIM[0], base = [], S = null, gen = null, jugando = false, terminado = false, pasoN = 0;
    let velocidad = 14, acum = 0, ultimo = 0;

    // ---------- datos ----------
    const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    function generarBase(){
      const n = +$("animTam").value, tipo = $("animTipo").value;
      let v = [];
      if(tipo === "repetidos"){
        const pool = [18, 37, 54, 73, 91];
        for(let i = 0; i < n; i++) v.push(pool[rnd(0, pool.length - 1)]);
      } else if(tipo === "aleatorio"){
        for(let i = 0; i < n; i++) v.push(rnd(10, 99));
      } else {
        for(let i = 0; i < n; i++) v.push(rnd(10, 99));
        v.sort((a, b) => a - b);
        if(tipo === "invertido") v.reverse();
        else for(let k = 0; k < 2; k++){ const i = rnd(0, n - 1), j = rnd(0, n - 1); [v[i], v[j]] = [v[j], v[i]]; }
      }
      base = v;
    }

    // ---------- estado de una ejecución ----------
    function nuevoEstado(){
      return { a: base.slice(), aux: null, auxCol: null, auxModo: "fila", auxMin: 0,
               hl: {kind: null, idx: []}, auxHl: [], ok: new Set(), rng: null, piv: -1, pref: 0,
               msg: "Listo para comenzar.", comp: 0, inter: 0, iter: 0 };
    }
    function reiniciar(){
      S = nuevoEstado();
      gen = ALGS[metodo.id](S);
      jugando = false; terminado = false; pasoN = 0;
      $("animPlay").textContent = "▶ Reproducir";
      actualizar();
    }

    // ---------- generadores (un 'yield' = un paso visible) ----------
    const show = (S, kind, idx, msg) => { S.hl = {kind, idx}; S.msg = msg; };
    function swap(S, i, j){
      const a = S.a, t = a[i]; a[i] = a[j]; a[j] = t; S.inter++;
      if(S.piv === i) S.piv = j; else if(S.piv === j) S.piv = i;
    }
    const ALGS = {};

    ALGS.burbuja = function*(S){
      const a = S.a, n = a.length;
      for(let i = 0; i < n - 1; i++){
        S.iter++;
        for(let j = 0; j < n - i - 1; j++){
          S.iter++; S.comp++;
          show(S, "cmp", [j, j+1], `¿${a[j]} > ${a[j+1]}?`); yield;
          if(a[j] > a[j+1]){ swap(S, j, j+1); show(S, "swap", [j, j+1], "Sí: intercambio los dos elementos (el mayor avanza a la derecha)."); yield; }
        }
        S.ok.add(n - 1 - i);
      }
    };

    ALGS.burbujaMej = function*(S){
      const a = S.a, n = a.length;
      let lim = n - 1, hubo = true;
      while(hubo){
        S.iter++; hubo = false; let ult = 0; S.rng = [0, lim];
        for(let j = 0; j < lim; j++){
          S.iter++; S.comp++;
          show(S, "cmp", [j, j+1], `¿${a[j]} > ${a[j+1]}?`); yield;
          if(a[j] > a[j+1]){ swap(S, j, j+1); hubo = true; ult = j; show(S, "swap", [j, j+1], "Intercambio y recuerdo la posición del último intercambio."); yield; }
        }
        for(let k = ult + 1; k < n; k++) S.ok.add(k);
        if(!hubo){ show(S, null, [], "Una pasada sin intercambios: ya está ordenado, me detengo."); yield; }
        lim = ult;
      }
      S.rng = null;
    };

    ALGS.quick = function*(S){
      function* quick(l, r){
        const a = S.a;
        if(l > r) return;
        if(l === r){ S.ok.add(l); return; }
        let i = l, j = r;
        const pidx = (l + r) >> 1; S.piv = pidx; const pv = a[pidx]; S.rng = [l, r];
        show(S, null, [], `Rango [${l}..${r}]: pivote = ${pv} (elemento central).`); yield;
        while(i <= j){
          S.iter++;
          while(true){ S.comp++; show(S, "cmp", [i], `¿${a[i]} < pivote ${pv}? (avanza i)`); yield; if(a[i] < pv){ i++; S.iter++; } else break; }
          while(true){ S.comp++; show(S, "cmp", [j], `¿${a[j]} > pivote ${pv}? (retrocede j)`); yield; if(a[j] > pv){ j--; S.iter++; } else break; }
          if(i <= j){
            if(i < j){ swap(S, i, j); show(S, "swap", [i, j], "Intercambio: uno mayor al pivote a la izquierda con uno menor a la derecha."); yield; }
            i++; j--;
          }
        }
        yield* quick(l, j);
        yield* quick(i, r);
        S.rng = null; S.piv = -1;
      }
      yield* quick(0, S.a.length - 1);
    };

    ALGS.shell = function*(S){
      const a = S.a, n = a.length;
      for(let g = n >> 1; g > 0; g >>= 1){
        S.iter++;
        for(let i = g; i < n; i++){
          S.iter++;
          const clave = a[i]; let j = i;
          show(S, "cmp", [i], `Salto ${g}: tomo la clave ${clave}.`); yield;
          while(j >= g){
            S.comp++; show(S, "cmp", [j - g, j], `¿${a[j-g]} > clave ${clave}?`); yield;
            if(a[j-g] > clave){ a[j] = a[j-g]; S.inter++; S.iter++; show(S, "set", [j], `Desplazo ${a[j]} ${g} lugares a la derecha (clave = ${clave}).`); yield; j -= g; }
            else break;
          }
          if(j !== i){ a[j] = clave; S.inter++; show(S, "set", [j], `Coloco la clave ${clave} en su posición para el salto ${g}.`); yield; }
        }
      }
    };

    ALGS.seleccion = function*(S){
      const a = S.a, n = a.length;
      for(let i = 0; i < n - 1; i++){
        S.iter++; let m = i; S.piv = m;
        for(let j = i + 1; j < n; j++){
          S.iter++; S.comp++;
          show(S, "cmp", [j], `¿${a[j]} < mínimo actual ${a[m]}?`); yield;
          if(a[j] < a[m]){ m = j; S.piv = m; }
        }
        if(m !== i){ swap(S, i, m); show(S, "swap", [i, m], `Llevo el mínimo ${a[i]} a la posición ${i}.`); yield; }
        S.piv = -1; S.ok.add(i);
      }
    };

    ALGS.insercion = function*(S){
      const a = S.a, n = a.length;
      for(let i = 1; i < n; i++){
        S.iter++; S.pref = i;
        const clave = a[i]; let j = i - 1;
        show(S, "cmp", [i], `Tomo la clave ${clave}; a su izquierda hay ${i} elementos ordenados.`); yield;
        while(j >= 0){
          S.comp++; show(S, "cmp", [j], `¿${a[j]} > clave ${clave}?`); yield;
          if(a[j] > clave){ a[j+1] = a[j]; S.inter++; S.iter++; show(S, "set", [j+1], `Desplazo ${a[j]} una posición a la derecha (clave = ${clave}).`); yield; j--; }
          else break;
        }
        if(j + 1 !== i){ a[j+1] = clave; S.inter++; show(S, "set", [j+1], `Inserto la clave ${clave} en su hueco.`); yield; }
      }
      S.pref = n;
    };

    ALGS.shaker = function*(S){
      const a = S.a;
      let l = 0, r = a.length - 1, hubo = true;
      while(hubo && l < r){
        S.iter++; hubo = false; S.rng = [l, r];
        for(let j = l; j < r; j++){
          S.iter++; S.comp++; show(S, "cmp", [j, j+1], `Ida: ¿${a[j]} > ${a[j+1]}?`); yield;
          if(a[j] > a[j+1]){ swap(S, j, j+1); hubo = true; show(S, "swap", [j, j+1], "Intercambio (sube el mayor)."); yield; }
        }
        S.ok.add(r); r--;
        for(let j = r; j > l; j--){
          S.iter++; S.comp++; show(S, "cmp", [j-1, j], `Vuelta: ¿${a[j-1]} > ${a[j]}?`); yield;
          if(a[j-1] > a[j]){ swap(S, j-1, j); hubo = true; show(S, "swap", [j-1, j], "Intercambio (baja el menor)."); yield; }
        }
        S.ok.add(l); l++;
      }
      S.rng = null;
    };

    ALGS.merge = function*(S){
      const a = S.a, n = a.length;
      S.aux = new Array(n).fill(null);
      function* merge(lo, hi){
        if(lo >= hi) return;
        const mid = (lo + hi) >> 1;
        S.rng = [lo, hi];
        show(S, null, [], `Divido [${lo}..${hi}] en [${lo}..${mid}] y [${mid+1}..${hi}].`); yield;
        yield* merge(lo, mid); yield* merge(mid + 1, hi);
        S.rng = [lo, hi];
        for(let k = lo; k <= hi; k++){ S.aux[k] = a[k]; S.iter++; }
        S.auxHl = [];
        show(S, null, [], `Copio [${lo}..${hi}] al auxiliar y mezclo las dos mitades ordenadas.`); yield;
        let i = lo, j = mid + 1;
        for(let k = lo; k <= hi; k++){
          S.iter++;
          let msg;
          if(i > mid){ a[k] = S.aux[j]; S.auxHl = [j]; msg = "La mitad izquierda se acabó: tomo de la derecha."; j++; }
          else if(j > hi){ a[k] = S.aux[i]; S.auxHl = [i]; msg = "La mitad derecha se acabó: tomo de la izquierda."; i++; }
          else {
            S.comp++; S.auxHl = [i, j];
            show(S, null, [], `¿${S.aux[j]} < ${S.aux[i]}? (frentes de cada mitad)`); yield;
            if(S.aux[j] < S.aux[i]){ a[k] = S.aux[j]; S.auxHl = [j]; msg = "Tomo el menor: el de la mitad derecha."; j++; }
            else { a[k] = S.aux[i]; S.auxHl = [i]; msg = "Tomo el menor: el de la mitad izquierda."; i++; }
          }
          S.inter++; show(S, "set", [k], msg); yield;
        }
        S.auxHl = [];
      }
      yield* merge(0, n - 1);
      S.rng = null;
    };

    ALGS.radix = function*(S){
      const a = S.a, n = a.length;
      S.aux = new Array(n).fill(null);
      for(let exp = 1; exp <= 10; exp *= 10){
        S.iter++;
        const nombre = exp === 1 ? "unidades" : "decenas";
        const cuenta = new Array(10).fill(0);
        for(let k = 0; k < n; k++){ cuenta[Math.floor(a[k] / exp) % 10]++; S.iter++; }
        for(let d = 1; d < 10; d++) cuenta[d] += cuenta[d-1];
        S.aux.fill(null); S.auxHl = [];
        show(S, null, [], `Pasada por ${nombre}: cuento cuántos hay de cada dígito (0-9) y calculo las posiciones finales.`); yield;
        for(let k = n - 1; k >= 0; k--){
          S.iter++;
          const d = Math.floor(a[k] / exp) % 10, pos = --cuenta[d];
          S.aux[pos] = a[k]; S.inter++; S.auxHl = [pos];
          show(S, "cmp", [k], `${a[k]}: dígito de ${nombre} = ${d} → va a la posición ${pos} del auxiliar.`); yield;
        }
        for(let k = 0; k < n; k++){ a[k] = S.aux[k]; S.inter++; S.iter++; }
        show(S, "set", a.map((_, k) => k), `Copio el auxiliar al arreglo: ordenado por ${nombre} (de forma estable).`); S.auxHl = []; yield;
        S.aux.fill(null);
      }
      S.aux = null;
    };

    ALGS.heap = function*(S){
      const a = S.a, n = a.length;
      function* hundir(i, tam){
        while(2 * i + 1 < tam){
          S.iter++;
          let h = 2 * i + 1;
          if(h + 1 < tam){
            S.comp++; show(S, "cmp", [h, h+1], `Comparo los hijos ${a[h]} y ${a[h+1]} del nodo ${i}: elijo el mayor.`); yield;
            if(a[h+1] > a[h]) h++;
          }
          S.comp++; show(S, "cmp", [i, h], `¿padre ${a[i]} ≥ hijo mayor ${a[h]}?`); yield;
          if(a[i] >= a[h]) break;
          swap(S, i, h); show(S, "swap", [i, h], "El padre baja y el hijo mayor sube."); yield;
          i = h;
        }
      }
      S.rng = [0, n - 1];
      show(S, null, [], "Fase 1: construyo el montículo máximo hundiendo los nodos internos de abajo hacia arriba."); yield;
      for(let i = (n >> 1) - 1; i >= 0; i--){ S.iter++; yield* hundir(i, n); }
      show(S, null, [], "Montículo máximo listo: la raíz (posición 0) es el mayor."); yield;
      for(let fin = n - 1; fin > 0; fin--){
        S.iter++;
        swap(S, 0, fin); S.ok.add(fin); S.rng = [0, fin - 1];
        show(S, "swap", [0, fin], `Fase 2: mando la raíz (${a[fin]}) a la posición ${fin} y reparo el montículo.`); yield;
        yield* hundir(0, fin);
      }
      S.rng = null;
    };

    ALGS.cubo = function*(S){
      const a = S.a, n = a.length, B = 9;
      const idx = v => Math.floor(v / 10) - 1;
      const inicio = new Array(B + 1).fill(0);
      for(let k = 0; k < n; k++){ inicio[idx(a[k]) + 1]++; S.iter++; }
      for(let b = 0; b < B; b++) inicio[b+1] += inicio[b];
      S.aux = new Array(n).fill(null); S.auxCol = new Array(n).fill(null);
      show(S, null, [], "Defino 9 cubos por decenas (10-19, 20-29, ..., 90-99) y cuento cuántos elementos caen en cada uno."); yield;
      const sig = inicio.slice(0, B);
      for(let k = 0; k < n; k++){
        S.iter++;
        const b = idx(a[k]), pos = sig[b]++;
        S.aux[pos] = a[k]; S.auxCol[pos] = b; S.inter++; S.auxHl = [pos];
        show(S, "cmp", [k], `${a[k]} cae en el cubo ${b + 1} (${(b+1)*10}-${(b+1)*10+9}).`); yield;
      }
      for(let b = 0; b < B; b++){
        S.iter++;
        for(let i = inicio[b] + 1; i < inicio[b+1]; i++){
          S.iter++;
          const clave = S.aux[i]; let j = i - 1;
          S.auxHl = [i]; show(S, null, [], `Cubo ${b + 1}: inserto ${clave} entre los ya ordenados del cubo.`); yield;
          while(j >= inicio[b]){
            S.comp++; S.auxHl = [j, j + 1]; show(S, null, [], `¿${S.aux[j]} > ${clave}?`); yield;
            if(S.aux[j] > clave){ S.aux[j+1] = S.aux[j]; S.inter++; S.iter++; j--; } else break;
          }
          if(j + 1 !== i){ S.aux[j+1] = clave; S.inter++; }
          S.auxHl = [j + 1]; show(S, null, [], `${clave} queda en su posición dentro del cubo ${b + 1}.`); yield;
        }
      }
      for(let k = 0; k < n; k++){ a[k] = S.aux[k]; S.inter++; S.iter++; }
      S.auxHl = [];
      show(S, "set", a.map((_, k) => k), "Concateno los cubos (ya ordenados) de vuelta al arreglo original."); yield;
    };

    ALGS.counting = function*(S){
      const a = S.a, n = a.length;
      const mn = Math.min(...a), mx = Math.max(...a);
      const cnt = new Array(mx - mn + 1).fill(0);
      S.aux = cnt; S.auxModo = "conteo"; S.auxMin = mn;
      show(S, null, [], `Creo un arreglo de conteo con un contador por cada valor posible (${mn} a ${mx}).`); yield;
      for(let k = 0; k < n; k++){
        S.iter++; cnt[a[k] - mn]++; S.auxHl = [a[k] - mn];
        show(S, "cmp", [k], `Cuento el ${a[k]} (ahora hay ${cnt[a[k] - mn]}).`); yield;
      }
      let pos = 0;
      for(let v = 0; v < cnt.length; v++){
        S.iter++;
        while(cnt[v] > 0){
          S.iter++; a[pos] = v + mn; cnt[v]--; S.inter++; S.auxHl = [v];
          show(S, "set", [pos], `Escribo ${v + mn} en la posición ${pos} (el contador baja a ${cnt[v]}).`); yield;
          S.ok.add(pos); pos++;
        }
      }
    };

    // ---------- dibujo ----------
    const C = {base:"#4f6b95", cmp:"#f5a524", swap:"#f0655f", piv:"#a78bfa", ok:"#34d399", okDim:"#1f7a5c", txt:"#e4e9f2", mut:"#8b98ab", rng:"rgba(245,165,36,0.07)"};
    function ajustarCanvas(){
      const w = Math.max(320, canvas.parentElement.clientWidth - 0), h = 360, dpr = window.devicePixelRatio || 1;
      if(canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)){
        canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
        canvas.style.width = w + "px"; canvas.style.height = h + "px";
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return {w, h};
    }
    function barras(vals, x0, y0, W, H, colorFn, opts){
      const n = vals.length, gap = n > 30 ? 1 : 2, bw = (W - gap * (n - 1)) / n;
      const maxV = opts.max || 100;
      for(let i = 0; i < n; i++){
        const v = vals[i]; if(v === null || v === undefined) continue;
        const bh = Math.max(2, (v / maxV) * (H - 16)), x = x0 + i * (bw + gap), y = y0 + H - bh;
        ctx.fillStyle = colorFn(i); ctx.fillRect(x, y, bw, bh);
        if(opts.etiquetas && bw >= 15){
          ctx.fillStyle = C.txt; ctx.font = "11px Consolas, monospace"; ctx.textAlign = "center";
          ctx.fillText(v, x + bw / 2, y - 3);
        }
      }
    }
    function dibujar(){
      const {w, h} = ajustarCanvas();
      ctx.clearRect(0, 0, w, h);
      const a = S.a, n = a.length, pad = 8;
      const tieneAux = !!S.aux;
      const hMain = tieneAux ? 190 : h - 16, W = w - pad * 2;
      const gap = n > 30 ? 1 : 2, bw = (W - gap * (n - 1)) / n;
      // región activa
      if(S.rng){
        ctx.fillStyle = C.rng;
        ctx.fillRect(pad + S.rng[0] * (bw + gap) - 1, 0, (S.rng[1] - S.rng[0] + 1) * (bw + gap), hMain + 8);
      }
      const resaltado = new Set(S.hl.idx);
      barras(a, pad, 4, W, hMain, i => {
        if(resaltado.has(i)) return S.hl.kind === "cmp" ? C.cmp : (S.hl.kind === "swap" || S.hl.kind === "set") ? C.swap : C.base;
        if(i === S.piv) return C.piv;
        if(S.ok.has(i)) return C.ok;
        if(i < S.pref) return C.okDim;
        return C.base;
      }, {etiquetas: true});
      if(tieneAux){
        const y0 = hMain + 30, hA = h - y0 - 6;
        ctx.strokeStyle = "#223047"; ctx.beginPath(); ctx.moveTo(pad, hMain + 14); ctx.lineTo(w - pad, hMain + 14); ctx.stroke();
        ctx.fillStyle = C.mut; ctx.font = "11px sans-serif"; ctx.textAlign = "left";
        const auxHl = new Set(S.auxHl);
        if(S.auxModo === "conteo"){
          ctx.fillText(`Arreglo de conteo (índice = valor, de ${S.auxMin} a ${S.auxMin + S.aux.length - 1}); altura = cuántas veces aparece`, pad, hMain + 26);
          const maxC = Math.max(1, ...S.aux);
          const m = S.aux.length, g2 = 1, bw2 = (W - g2 * (m - 1)) / m;
          for(let i = 0; i < m; i++){
            const v = S.aux[i], bh = v === 0 ? 1 : 4 + (v / maxC) * (hA - 10), x = pad + i * (bw2 + g2);
            ctx.fillStyle = auxHl.has(i) ? C.cmp : v === 0 ? "#223047" : C.base;
            ctx.fillRect(x, y0 + hA - bh, bw2, bh);
          }
        } else {
          ctx.fillText("Arreglo auxiliar", pad, hMain + 26);
          barras(S.aux, pad, y0, W, hA, i => auxHl.has(i) ? C.cmp : S.auxCol && S.auxCol[i] !== null ? `hsl(${S.auxCol[i] * 40 + 190},55%,52%)` : C.base, {etiquetas: true});
        }
      }
    }
    function actualizar(){
      dibujar();
      $("animMsg").textContent = S.msg;
      $("animCont").innerHTML = `
        <div><b>${S.comp}</b><span>Comparaciones</span></div>
        <div><b>${S.inter}</b><span>Intercambios / movimientos</span></div>
        <div><b>${S.iter}</b><span>Iteraciones</span></div>
        <div><b>${pasoN}</b><span>Pasos animados</span></div>`;
    }
    function infoMetodo(){
      const m = metodo;
      $("animInfo").innerHTML = `
        <h2>${m.nombre}</h2>
        <div class="chips">
          <span class="chip">Recursivo: <b>${m.rec ? "Sí" : "No"}</b></span>
          <span class="chip">int: <b>Sí</b></span>
          <span class="chip ${m.str ? "" : "chip-no"}">String: <b>${m.str ? "Sí" : "No"}</b></span>
          <span class="chip">Tiempo: <b>${m.tiempo}</b></span>
          <span class="chip">Memoria extra: <b>${m.mem}</b></span>
        </div>
        <p>${m.idea}</p>`;
    }

    // ---------- ejecución ----------
    function paso(){
      if(terminado) return;
      const r = gen.next();
      pasoN++;
      if(r.done){
        terminado = true; jugando = false;
        S.ok = new Set(S.a.map((_, i) => i)); S.hl = {kind: null, idx: []}; S.piv = -1; S.rng = null; S.pref = 0; S.auxHl = [];
        S.msg = `¡Arreglo ordenado! ${S.comp} comparaciones, ${S.inter} intercambios/movimientos, ${S.iter} iteraciones.`;
        $("animPlay").textContent = "▶ Reproducir";
      }
      actualizar();
    }
    function tick(ts){
      if(!canvas.isConnected) return;
      const dt = Math.min(100, ts - ultimo); ultimo = ts;
      if(jugando){
        acum += dt * velocidad / 1000;
        while(acum >= 1 && jugando){ acum -= 1; paso(); }
      }
      requestAnimationFrame(tick);
    }

    // ---------- controles ----------
    const cont = $("animMetodos");
    METODOS_ANIM.forEach((m, i) => {
      const b = document.createElement("button");
      b.className = "anim-m" + (i === 0 ? " activo" : "");
      b.innerHTML = `<span>${String(i + 1).padStart(2, "0")}</span> ${m.nombre}`;
      b.addEventListener("click", () => {
        metodo = m;
        cont.querySelectorAll(".anim-m").forEach(x => x.classList.remove("activo"));
        b.classList.add("activo");
        infoMetodo(); reiniciar();
      });
      cont.appendChild(b);
    });
    $("animPlay").addEventListener("click", () => {
      if(terminado) reiniciar();
      jugando = !jugando;
      $("animPlay").textContent = jugando ? "⏸ Pausar" : "▶ Reproducir";
    });
    $("animPaso").addEventListener("click", () => { jugando = false; $("animPlay").textContent = "▶ Reproducir"; if(terminado) reiniciar(); paso(); });
    $("animReset").addEventListener("click", reiniciar);
    $("animNuevo").addEventListener("click", () => { generarBase(); reiniciar(); });
    $("animTipo").addEventListener("change", () => { generarBase(); reiniciar(); });
    $("animTam").addEventListener("change", () => { generarBase(); reiniciar(); });
    $("animVel").addEventListener("input", e => { velocidad = +e.target.value; $("animVelTxt").textContent = velocidad + " pasos/s"; });
    $("animVelTxt").textContent = velocidad + " pasos/s";

    generarBase(); infoMetodo();
    // el canvas debe estar en el DOM para medir su ancho
    setTimeout(() => { reiniciar(); ultimo = performance.now(); requestAnimationFrame(tick); }, 0);
    window.addEventListener("resize", () => { if(canvas.isConnected && S) dibujar(); });
    return sec;
  }

  function copiarAlPortapapeles(texto, boton){
    const restaurar = boton.textContent;
    const marcarExito = () => {
      boton.textContent = "¡Copiado!";
      setTimeout(()=> boton.textContent = restaurar, 1500);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(texto).then(marcarExito).catch(()=> mostrarToast("No se pudo copiar"));
    } else {
      const ta = document.createElement("textarea");
      ta.value = texto;
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand("copy"); marcarExito(); } catch(e){ mostrarToast("No se pudo copiar"); }
      document.body.removeChild(ta);
    }
  }

  function escapeHTML(s){
    return (s || "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  }
  function escapeAttr(s){
    return (s === undefined || s === null ? "" : s).toString().replace(/"/g, "&quot;");
  }

  // --- Agregar / quitar puntos ---
  document.getElementById("btnAgregarPunto").addEventListener("click", () => {
    const p = nuevoPunto(estado.puntos.length + 1);
    estado.puntos.push(p);
    estado.activo = p.id;
    render();
  });

  // --- Exportar / Importar proyecto ---
  document.getElementById("btnExportar").addEventListener("click", () => {
    const data = { nombreProyecto: nombreProyecto.value, puntos: estado.puntos };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = (nombreProyecto.value || "taller").replace(/\s+/g,"_") + ".json";
    a.click();
    URL.revokeObjectURL(url);
    mostrarToast("Proyecto exportado");
  });

  document.getElementById("btnImportar").addEventListener("click", () => {
    document.getElementById("inputImportar").click();
  });

  document.getElementById("inputImportar").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(!Array.isArray(data.puntos) || data.puntos.length === 0) throw new Error("formato inválido");
        estado.puntos = data.puntos;
        estado.activo = estado.puntos[0].id;
        nombreProyecto.value = data.nombreProyecto || nombreProyecto.value;
        render();
        mostrarToast("Proyecto importado");
      }catch(err){
        mostrarToast("Archivo inválido");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  document.getElementById("btnImprimir").addEventListener("click", () => {
    window.print();
  });

  // Al imprimir / exportar a PDF se incluyen TODOS los puntos, uno por página.
  // Al terminar, se restaura la vista normal (solo el punto activo).
  window.addEventListener("beforeprint", () => {
    contenedorPuntos.innerHTML = "";
    estado.puntos.forEach((p, i) => {
      contenedorPuntos.appendChild(construirSeccionPunto(p, i + 1));
    });
    contenedorPuntos.querySelectorAll("textarea").forEach(ta => {
      ta.style.height = "auto";
      ta.style.height = (ta.scrollHeight + 4) + "px";
    });
  });
  window.addEventListener("afterprint", () => {
    render();
  });

  render();
})();
</script>
